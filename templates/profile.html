<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>프로필 • Woongstagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { -webkit-text-size-adjust: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between transition-colors pb-16 md:pb-0">

    <!-- Header Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="text-xl sm:text-2xl font-black italic font-serif text-slate-900 dark:text-white select-none">
                Woongstagram
            </a>
            <div class="flex items-center gap-4 sm:gap-5 text-lg sm:text-xl text-slate-800 dark:text-slate-200">
                <a href="/" title="홈"><i class="fa-solid fa-house"></i></a>
                <a href="/profile" class="font-bold text-blue-500" title="프로필"><i class="fa-solid fa-user"></i></a>
            </div>
        </div>
    </header>

    <!-- Profile Main Section -->
    <main class="max-w-4xl mx-auto px-4 py-6 sm:py-8 w-full flex-1">
        <div id="profileHeader" class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-8 pb-6 sm:pb-8 border-b border-slate-200 dark:border-slate-800">
            <div class="relative group shrink-0">
                <div id="profileAvatarBox" class="w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center font-bold shadow-md overflow-hidden">
                    <i class="fa-solid fa-user text-3xl sm:text-4xl text-slate-400"></i>
                </div>
            </div>

            <div class="flex flex-col gap-3 sm:gap-4 text-center sm:text-left flex-1 w-full">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 justify-center sm:justify-start">
                    <h1 id="profileUsername" class="text-lg sm:text-xl font-bold">@username</h1>
                    <div id="profileActionArea" class="flex items-center justify-center sm:justify-start gap-2"></div>
                </div>

                <div class="flex justify-center sm:justify-start gap-6 sm:gap-8 text-xs sm:text-sm">
                    <div>게시물 <span id="postCount" class="font-bold">0</span></div>
                    <div>팔로워 <span id="followerCount" class="font-bold">0</span></div>
                    <div>팔로우 <span id="followingCount" class="font-bold">0</span></div>
                </div>

                <!-- 📝 자기소개 -->
                <div class="text-xs space-y-1 mt-1">
                    <p id="profileEmail" class="text-slate-400 text-[11px]"></p>
                    <p id="profileBio" class="font-medium whitespace-pre-wrap break-all"></p>
                </div>
            </div>
        </div>

        <!-- 🔒 비공개 계정 잠금 안내 -->
        <div id="privateLockNotice" class="hidden text-center py-20">
            <i class="fa-solid fa-lock text-4xl text-slate-400 mb-3"></i>
            <h3 class="font-bold text-sm">비공개 계정입니다</h3>
            <p class="text-xs text-slate-500 mt-1">사진과 동영상을 보려면 팔로우 요청을 보내세요.</p>
        </div>

        <!-- 탭 메뉴 (본인 계정일 때만 '좋아요' 및 '저장됨' 노출) -->
        <div id="profileTabsArea" class="flex justify-center border-t border-slate-200 dark:border-slate-800 -mt-[1px] gap-6 sm:gap-12">
            <button onclick="switchTab('posts')" id="tabPostsBtn" class="flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider">
                <i class="fa-solid fa-table-cells text-sm"></i> 게시물
            </button>
            <button onclick="switchTab('likes')" id="tabLikesBtn" class="hidden items-center gap-2 py-3 border-t-2 border-transparent font-semibold text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 tracking-wider">
                <i class="fa-solid fa-heart text-sm"></i> 좋아요
            </button>
            <button onclick="switchTab('bookmarks')" id="tabBookmarksBtn" class="hidden items-center gap-2 py-3 border-t-2 border-transparent font-semibold text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 tracking-wider" title="나만 볼 수 있는 저장된 게시물">
                <i class="fa-solid fa-bookmark text-sm"></i> 저장됨
            </button>
        </div>

        <div id="myPostsGrid" class="grid grid-cols-3 gap-1 sm:gap-4 mt-2"></div>
    </main>

    <!-- 📱 모바일 하단 전용 내비게이션 바 -->
    <nav class="fixed bottom-0 left-0 right-0 h-12 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 z-40 flex items-center justify-around text-lg text-slate-800 dark:text-slate-200 md:hidden">
        <a href="/" class="p-2 hover:text-blue-500"><i class="fa-solid fa-house"></i></a>
        <a href="/profile" class="p-2 text-blue-500"><i class="fa-solid fa-user"></i></a>
    </nav>

    <!-- ⚙️ 환경설정 모달 -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl relative text-center text-xs divide-y divide-slate-100 dark:divide-slate-800 border border-slate-200 dark:border-slate-800">
            <div class="py-4 font-bold text-sm">환경설정</div>
            
            <div class="p-3.5 flex items-center justify-between px-6">
                <span class="font-semibold flex items-center gap-2"><i class="fa-solid fa-lock text-slate-400"></i> 비공개 계정</span>
                <input type="checkbox" id="privateAccountSwitch" onchange="togglePrivateSetting(this.checked)" class="w-4 h-4 cursor-pointer">
            </div>

            <button onclick="logout()" class="w-full py-3.5 text-red-500 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800">로그아웃</button>
            <button onclick="closeSettingsModal()" class="w-full py-3.5 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800">닫기</button>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const targetUserFromUrl = pathParts.length > 2 && pathParts[2] ? decodeURIComponent(pathParts[2]) : null;
        let currentProfileUser = null;
        let loggedInUser = null;

        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            initProfile();
        });

        async function initProfile() {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();
            if (meData.logged_in) loggedInUser = meData.username;

            let targetUser = targetUserFromUrl || (meData.logged_in ? meData.username : null);
            if (!targetUser) { window.location.href = '/'; return; }
            currentProfileUser = targetUser;

            const userRes = await fetch(`/api/users/${encodeURIComponent(targetUser)}`);
            const userData = await userRes.json();
            if (userData.status !== 'success') { alert('사용자를 찾을 수 없습니다.'); window.location.href = '/'; return; }

            const u = userData.user;
            document.getElementById('profileUsername').innerText = `@${u.username}`;
            document.getElementById('followerCount').innerText = u.follower_count;
            document.getElementById('followingCount').innerText = u.following_count;
            document.getElementById('profileBio').innerText = u.bio || '';

            const avatarBox = document.getElementById('profileAvatarBox');
            if (u.profile_img) {
                avatarBox.innerHTML = `<img src="${u.profile_img}" class="w-full h-full object-cover">`;
            } else {
                avatarBox.innerHTML = `<i class="fa-solid fa-user text-3xl sm:text-4xl text-slate-400"></i>`;
            }

            const isMyProfile = meData.logged_in && (meData.username === u.username);
            const actionArea = document.getElementById('profileActionArea');

            if (isMyProfile) {
                document.getElementById('profileEmail').innerText = u.email;
                // 🔒 내 프로필일 때만 '좋아요' 및 '저장됨' 탭 표시
                document.getElementById('tabLikesBtn').classList.remove('hidden');
                document.getElementById('tabLikesBtn').classList.add('flex');
                document.getElementById('tabBookmarksBtn').classList.remove('hidden');
                document.getElementById('tabBookmarksBtn').classList.add('flex');
                document.getElementById('privateAccountSwitch').checked = u.is_private;

                actionArea.innerHTML = `
                    <button onclick="openSettingsModal()" class="p-2 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-base"><i class="fa-solid fa-gear"></i></button>
                `;
            } else {
                // 🔒 타인 프로필일 때는 '좋아요' 및 '저장됨' 탭을 완벽히 숨김
                document.getElementById('tabLikesBtn').classList.add('hidden');
                document.getElementById('tabLikesBtn').classList.remove('flex');
                document.getElementById('tabBookmarksBtn').classList.add('hidden');
                document.getElementById('tabBookmarksBtn').classList.remove('flex');

                let btnText = '팔로우';
                let btnClass = 'bg-blue-500 hover:bg-blue-600 text-white';

                if (u.is_following) {
                    btnText = '팔로잉';
                    btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
                } else if (u.is_requested) {
                    btnText = '요청됨';
                    btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700';
                }

                actionArea.innerHTML = `
                    <button onclick="handleFollowToggle('${escapeHtml(u.username)}', this)" class="px-4 py-1.5 font-bold text-xs rounded-lg transition ${btnClass}">${btnText}</button>
                    <a href="/?dm=${encodeURIComponent(u.username)}" class="px-4 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-white font-bold text-xs rounded-lg transition border border-slate-200 dark:border-slate-700">메시지</a>
                `;
            }

            if (!u.can_view_content) {
                document.getElementById('privateLockNotice').classList.remove('hidden');
                document.getElementById('profileTabsArea').classList.add('hidden');
                document.getElementById('myPostsGrid').classList.add('hidden');
            } else {
                document.getElementById('privateLockNotice').classList.add('hidden');
                document.getElementById('profileTabsArea').classList.remove('hidden');
                document.getElementById('myPostsGrid').classList.remove('hidden');
                switchTab('posts');
            }
        }

        function switchTab(tab) {
            const pBtn = document.getElementById('tabPostsBtn');
            const lBtn = document.getElementById('tabLikesBtn');
            const bBtn = document.getElementById('tabBookmarksBtn');

            pBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";
            lBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";
            bBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";

            if (tab === 'posts') {
                pBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/posts/user/${encodeURIComponent(currentProfileUser)}`).then(r => r.json()).then(d => renderGrid(d.posts));
            } else if (tab === 'likes') {
                lBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/liked-posts`).then(r => r.json()).then(d => renderGrid(d.posts));
            } else if (tab === 'bookmarks') {
                bBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/bookmarks`).then(r => r.json()).then(d => renderGrid(d.posts));
            }
        }

        function renderGrid(posts) {
            const grid = document.getElementById('myPostsGrid');
            grid.innerHTML = '';
            document.getElementById('postCount').innerText = posts ? posts.length : 0;

            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-center py-16 text-slate-400 text-xs">게시물이 없습니다.</div>';
                return;
            }

            posts.forEach(p => {
                const card = document.createElement('div');
                card.className = "aspect-square bg-slate-100 dark:bg-slate-800 rounded-lg overflow-hidden relative border border-slate-200 dark:border-slate-700 cursor-pointer";
                card.onclick = () => window.location.href = `/?post=${p.id}`;

                const images = p.image_urls && p.image_urls.length > 0 ? p.image_urls : (p.image_url ? [p.image_url] : []);
                const firstImg = images.length > 0 ? images[0] : '';

                if (p.is_video && firstImg) {
                    card.innerHTML = `
                        <video src="${escapeHtml(firstImg)}" class="w-full h-full object-cover"></video>
                        <i class="fa-solid fa-play absolute top-2 right-2 text-white text-xs drop-shadow"></i>
                    `;
                } else if (firstImg) {
                    card.innerHTML = `<img src="${escapeHtml(firstImg)}" class="w-full h-full object-cover">`;
                } else {
                    card.innerHTML = `<div class="p-2 text-[10px] text-center flex items-center justify-center h-full break-all">${escapeHtml(p.content)}</div>`;
                }
                grid.appendChild(card);
            });
        }

        function handleFollowToggle(target, btn) {
            if (!loggedInUser) { window.location.href = '/'; return; }
            fetch(`/api/follow/${encodeURIComponent(target)}`, { method: 'POST' })
                .then(res => res.json())
                .then(d => {
                    if (d.result_status === 'following') {
                        btn.innerText = '팔로잉';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
                    } else if (d.result_status === 'requested') {
                        btn.innerText = '요청됨';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700';
                    } else {
                        btn.innerText = '팔로우';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-blue-500 hover:bg-blue-600 text-white';
                    }
                    document.getElementById('followerCount').innerText = d.follower_count;
                });
        }

        function togglePrivateSetting(isPrivate) {
            fetch('/api/profile-privacy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_private: isPrivate })
            });
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function logout() { fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/'); }
        function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>

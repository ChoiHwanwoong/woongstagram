<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>프로필 • Woongstagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- ✂️ Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { -webkit-text-size-adjust: none; touch-action: manipulation; }
        .cropper-view-box, .cropper-face { border-radius: 50%; }
    </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between transition-colors pb-16 md:pb-0" onclick="handleOutsideClicks(event)">

    <!-- Header Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="text-xl sm:text-2xl font-black italic font-serif text-slate-900 dark:text-white select-none">
                Woongstagram
            </a>
            <div class="flex items-center gap-4 sm:gap-5 text-lg sm:text-xl text-slate-800 dark:text-slate-200">
                <a href="/" title="홈"><i class="fa-solid fa-house"></i></a>
                <a href="/profile" class="font-bold text-blue-500" title="프로필"><i class="fa-solid fa-user"></i></a>
            </div>
        </div>
    </header>

    <!-- Profile Main Section -->
    <main class="max-w-4xl mx-auto px-4 py-6 sm:py-8 w-full flex-1">
        <div id="profileHeader" class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-8 pb-6 sm:pb-8 border-b border-slate-200 dark:border-slate-800">
            <!-- 프로필 사진 영역 -->
            <div class="relative group shrink-0 cursor-pointer" onclick="handleAvatarClick()">
                <div id="profileAvatarBox" class="w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-slate-200 dark:bg-slate-800 border-2 border-slate-300 dark:border-slate-700 flex items-center justify-center font-bold shadow-md overflow-hidden group-hover:opacity-85 transition">
                    <i class="fa-solid fa-user text-3xl sm:text-4xl text-slate-400"></i>
                </div>
                <div id="avatarEditBadge" class="hidden absolute bottom-0 right-0 bg-blue-500 text-white p-2 rounded-full text-xs shadow">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <input type="file" id="profileFileInput" accept="image/*" class="hidden" onchange="handleProfileFileSelect(this)">
            </div>

            <div class="flex flex-col gap-3 sm:gap-4 text-center sm:text-left flex-1 w-full">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 justify-center sm:justify-start">
                    <h1 id="profileUsername" class="text-lg sm:text-xl font-bold">@username</h1>
                    <div id="profileActionArea" class="flex items-center justify-center sm:justify-start gap-2"></div>
                </div>

                <div class="flex justify-center sm:justify-start gap-6 sm:gap-8 text-xs sm:text-sm select-none">
                    <div>게시물 <span id="postCount" class="font-bold">0</span></div>
                    <div class="cursor-pointer hover:underline" onclick="openFollowModal('followers')">팔로워 <span id="followerCount" class="font-bold">0</span></div>
                    <div class="cursor-pointer hover:underline" onclick="openFollowModal('following')">팔로우 <span id="followingCount" class="font-bold">0</span></div>
                </div>

                <!-- 📝 자기소개 -->
                <div class="text-xs space-y-1 mt-1">
                    <p id="profileEmail" class="text-slate-400 text-[11px]"></p>
                    <div class="flex items-center justify-center sm:justify-start gap-2">
                        <p id="profileBio" class="font-medium whitespace-pre-wrap break-all text-slate-700 dark:text-slate-300"></p>
                        <button id="editBioBtn" onclick="openBioModal()" class="hidden text-slate-400 hover:text-blue-500 text-xs p-1" title="자기소개 수정">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🔒 비공개 계정 잠금 안내 -->
        <div id="privateLockNotice" class="hidden text-center py-20">
            <i class="fa-solid fa-lock text-4xl text-slate-400 mb-3"></i>
            <h3 class="font-bold text-sm">비공개 계정입니다</h3>
            <p class="text-xs text-slate-500 mt-1">사진과 동영상을 보려면 팔로우 요청을 보내세요.</p>
        </div>

        <!-- 탭 메뉴 (게시물 / 좋아요 / 저장됨) -->
        <div id="profileTabsArea" class="flex justify-center border-t border-slate-200 dark:border-slate-800 -mt-[1px] gap-6 sm:gap-12">
            <button onclick="switchTab('posts')" id="tabPostsBtn" class="flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider">
                <i class="fa-solid fa-table-cells text-sm"></i> 게시물
            </button>
            <button onclick="switchTab('likes')" id="tabLikesBtn" class="flex items-center gap-2 py-3 border-t-2 border-transparent font-semibold text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 tracking-wider">
                <i class="fa-solid fa-heart text-sm"></i> 좋아요
            </button>
            <button onclick="switchTab('bookmarks')" id="tabBookmarksBtn" class="hidden items-center gap-2 py-3 border-t-2 border-transparent font-semibold text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 tracking-wider">
                <i class="fa-solid fa-bookmark text-sm"></i> 저장됨
            </button>
        </div>

        <div id="myPostsGrid" class="grid grid-cols-3 gap-1 sm:gap-4 mt-2"></div>
    </main>

    <!-- ✂️ 프로필 사진 크롭/편집 모달 -->
    <div id="profileCropperModal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl relative flex flex-col border border-slate-200 dark:border-slate-800">
            <div class="p-3 border-b border-slate-100 dark:border-slate-800 font-bold text-xs text-center flex justify-between items-center">
                <span>프로필 사진 자르기</span>
                <button onclick="closeProfileCropperModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-2 bg-black flex items-center justify-center h-64 overflow-hidden">
                <img id="profileCropperImage" class="max-w-full max-h-full block">
            </div>
            <div class="p-3 bg-slate-50 dark:bg-slate-800 flex justify-between items-center text-xs">
                <div class="flex gap-2">
                    <button onclick="profileCropperZoom(0.1)" class="p-1.5 bg-white dark:bg-slate-700 border rounded"><i class="fa-solid fa-plus"></i></button>
                    <button onclick="profileCropperZoom(-0.1)" class="p-1.5 bg-white dark:bg-slate-700 border rounded"><i class="fa-solid fa-minus"></i></button>
                    <button onclick="profileCropperRotate(90)" class="p-1.5 bg-white dark:bg-slate-700 border rounded"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <button id="saveProfileCropBtn" onclick="saveCroppedProfileImage()" class="px-4 py-1.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition">저장</button>
            </div>
        </div>
    </div>

    <!-- 📝 자기소개 수정 모달 -->
    <div id="bioModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative border border-slate-200 dark:border-slate-800 text-xs">
            <button onclick="closeBioModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-bold text-sm mb-3">자기소개 수정 (최대 30자)</h3>
            <textarea id="bioInput" rows="3" maxlength="30" placeholder="자신을 표현해보세요..." class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-transparent mb-3 resize-none"></textarea>
            <button onclick="saveBio()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition">저장하기</button>
        </div>
    </div>

    <!-- 👥 팔로워/팔로잉 목록 팝업 모달 (프로필 사진 포함) -->
    <div id="followListModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm h-96 rounded-2xl p-4 shadow-2xl relative flex flex-col border border-slate-200 dark:border-slate-800 text-xs">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                <span id="followListModalTitle" class="font-bold text-sm">팔로워 목록</span>
                <button onclick="closeFollowModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="followListContainer" class="flex-1 overflow-y-auto space-y-2.5 py-3"></div>
        </div>
    </div>

    <!-- ✏️ 게시글 수정 모달 -->
    <div id="editPostModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative border border-slate-200 dark:border-slate-800 text-xs">
            <button onclick="closeEditPostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-bold text-sm mb-3">게시글 내용 수정</h3>
            <textarea id="editPostContentInput" rows="4" placeholder="수정할 문구를 입력하세요..." class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-transparent mb-3 resize-none text-slate-900 dark:text-white"></textarea>
            <button id="saveEditPostBtn" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition">수정 완료</button>
        </div>
    </div>

    <!-- 🔍 프로필 전용 게시글 상세 보기 모달 -->
    <div id="profilePostDetailModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl max-h-[85vh] rounded-2xl overflow-hidden shadow-2xl relative flex flex-col sm:flex-row border border-slate-200 dark:border-slate-800">
            <button onclick="closeProfilePostDetailModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 z-10 p-1 bg-white/80 dark:bg-slate-800/80 rounded-full"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div id="profileModalImageArea" class="bg-black sm:w-1/2 flex items-center justify-center min-h-[220px]"></div>
            <div class="p-4 sm:w-1/2 flex flex-col justify-between text-xs overflow-y-auto bg-white dark:bg-slate-900">
                <div>
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
                        <div class="flex items-center gap-2">
                            <span id="profileModalUserAvatar" class="w-7 h-7 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0"></span>
                            <span id="profileModalUsername" class="font-bold text-slate-900 dark:text-white"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="profileModalEditPostBtn" class="hidden text-slate-400 hover:text-blue-500" title="게시글 수정"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button id="profileModalDeletePostBtn" class="hidden text-slate-400 hover:text-red-500" title="게시글 삭제"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <p id="profileModalContent" class="text-slate-700 dark:text-slate-300 leading-relaxed mb-4 pb-3 border-b border-slate-100 dark:border-slate-800 break-words"></p>
                    <div id="profileModalCommentsList" class="space-y-2 text-[11px] mb-4"></div>
                </div>
                <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                    <input type="text" id="profileModalCommentInput" placeholder="댓글 달기..." class="flex-1 text-xs outline-none bg-transparent text-slate-800 dark:text-slate-200 placeholder-slate-400">
                    <button id="profileModalCommentSubmitBtn" class="text-blue-500 font-semibold text-xs ml-2 hover:text-blue-700">게시</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📱 모바일 하단 전용 내비게이션 바 -->
    <nav class="fixed bottom-0 left-0 right-0 h-12 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 z-40 flex items-center justify-around text-lg text-slate-800 dark:text-slate-200 md:hidden">
        <a href="/" class="p-2 hover:text-blue-500"><i class="fa-solid fa-house"></i></a>
        <a href="/profile" class="p-2 text-blue-500"><i class="fa-solid fa-user"></i></a>
    </nav>

    <!-- ⚙️ 환경설정 메인 메뉴 모달 -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl relative text-center text-xs divide-y divide-slate-100 dark:divide-slate-800 border border-slate-200 dark:border-slate-800">
            <div class="py-4 font-bold text-sm">환경설정</div>
            
            <div class="p-3.5 flex items-center justify-between px-6">
                <span class="font-semibold flex items-center gap-2"><i class="fa-solid fa-lock text-slate-400"></i> 비공개 계정</span>
                <input type="checkbox" id="privateAccountSwitch" onchange="togglePrivateSetting(this.checked)" class="w-4 h-4 cursor-pointer">
            </div>

            <button onclick="openChangeUsernameModal()" class="w-full py-3.5 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold">아이디 변경 (30일 1회)</button>
            <button onclick="openChangePasswordModal()" class="w-full py-3.5 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold">비밀번호 변경</button>
            <button onclick="logout()" class="w-full py-3.5 text-blue-500 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800">로그아웃</button>
            <button onclick="openDeleteAccountModal()" class="w-full py-3.5 text-red-500 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800">회원 탈퇴</button>
            <button onclick="closeSettingsModal()" class="w-full py-3.5 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800">닫기</button>
        </div>
    </div>

    <!-- 👤 아이디 변경 모달 -->
    <div id="changeUsernameModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative border border-slate-200 dark:border-slate-800 text-xs">
            <button onclick="closeChangeUsernameModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-bold text-sm mb-2">새로운 아이디 설정</h3>
            <p class="text-[11px] text-slate-400 mb-3 leading-relaxed">아이디는 30일에 한 번만 변경할 수 있으며 기존 게시물 및 댓글 작성자가 모두 함께 업데이트됩니다.</p>
            <input type="text" id="newUsernameInput" placeholder="새로운 아이디 입력" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 mb-3">
            <button onclick="submitChangeUsername()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition">변경하기</button>
        </div>
    </div>

    <!-- 🔒 비밀번호 변경 모달 -->
    <div id="changePasswordModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative border border-slate-200 dark:border-slate-800 text-xs space-y-2.5">
            <button onclick="closeChangePasswordModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-bold text-sm mb-3">비밀번호 변경</h3>
            <input type="password" id="currentPasswordInput" placeholder="현재 비밀번호" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800">
            <input type="password" id="newPasswordInput" placeholder="새 비밀번호" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800">
            <button onclick="submitChangePassword()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition mt-2">비밀번호 변경 완료</button>
        </div>
    </div>

    <!-- ⚠️ 회원 탈퇴 모달 -->
    <div id="deleteAccountModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative border border-slate-200 dark:border-slate-800 text-xs space-y-3">
            <button onclick="closeDeleteAccountModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="font-bold text-sm text-red-500">회원 탈퇴</h3>
            <p class="text-slate-400 text-[11px] leading-relaxed">탈퇴 시 모든 게시글, 스토리, 댓글, 팔로우 내역이 영구적으로 삭제됩니다. 본인 확인을 위해 비밀번호를 입력해 주세요.</p>
            <input type="password" id="deleteAccountPasswordInput" placeholder="비밀번호 확인" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800">
            <button onclick="submitDeleteAccount()" class="w-full py-2.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg transition">탈퇴 확정</button>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const targetUserFromUrl = pathParts.length > 2 && pathParts[2] ? decodeURIComponent(pathParts[2]) : null;
        let currentProfileUser = null;
        let loggedInUser = null;
        let profileCropperInstance = null;

        function getDefaultAvatar(sizeClass = "text-base") {
            return `<div class="w-full h-full bg-slate-200 dark:bg-slate-700 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-user ${sizeClass}"></i></div>`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            initProfile();
        });

        async function initProfile() {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();
            if (meData.logged_in) loggedInUser = meData.username;

            let targetUser = targetUserFromUrl || (meData.logged_in ? meData.username : null);
            if (!targetUser) { window.location.href = '/'; return; }
            currentProfileUser = targetUser;

            const userRes = await fetch(`/api/users/${encodeURIComponent(targetUser)}`);
            const userData = await userRes.json();
            if (userData.status !== 'success') { alert('사용자를 찾을 수 없습니다.'); window.location.href = '/'; return; }

            const u = userData.user;
            document.getElementById('profileUsername').innerText = `@${u.username}`;
            document.getElementById('followerCount').innerText = u.follower_count;
            document.getElementById('followingCount').innerText = u.following_count;
            document.getElementById('profileBio').innerText = u.bio || '';

            // 📌 순수 게시물 개수를 별도로 불러와 고정
            fetch(`/api/posts/user/${encodeURIComponent(targetUser)}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('postCount').innerText = d.posts ? d.posts.length : 0;
                });

            const avatarBox = document.getElementById('profileAvatarBox');
            if (u.profile_img) {
                avatarBox.innerHTML = `<img src="${u.profile_img}" class="w-full h-full object-cover">`;
            } else {
                avatarBox.innerHTML = `<i class="fa-solid fa-user text-3xl sm:text-4xl text-slate-400"></i>`;
            }

            const isMyProfile = meData.logged_in && (meData.username === u.username);
            const actionArea = document.getElementById('profileActionArea');

            // 🌟 좋아요 탭은 본인 및 타인 모두 볼 수 있도록 항상 표시
            document.getElementById('tabLikesBtn').classList.remove('hidden');

            if (isMyProfile) {
                document.getElementById('profileEmail').innerText = u.email;
                document.getElementById('tabBookmarksBtn').classList.remove('hidden'); // 🔒 본인에게만 '저장됨' 탭 표시
                document.getElementById('privateAccountSwitch').checked = u.is_private;
                document.getElementById('avatarEditBadge').classList.remove('hidden');
                document.getElementById('editBioBtn').classList.remove('hidden');

                actionArea.innerHTML = `
                    <button onclick="openSettingsModal()" class="p-2 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-base" title="환경설정"><i class="fa-solid fa-gear"></i></button>
                `;
            } else {
                document.getElementById('tabBookmarksBtn').classList.add('hidden'); // 🚫 타인 프로필에서는 '저장됨' 탭 숨김

                let btnText = '팔로우';
                let btnClass = 'bg-blue-500 hover:bg-blue-600 text-white';

                if (u.is_following) {
                    btnText = '팔로잉';
                    btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
                } else if (u.is_requested) {
                    btnText = '요청됨';
                    btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700';
                }

                actionArea.innerHTML = `
                    <button onclick="handleFollowToggle('${escapeHtml(u.username)}', this)" class="px-4 py-1.5 font-bold text-xs rounded-lg transition ${btnClass}">${btnText}</button>
                    <a href="/?dm=${encodeURIComponent(u.username)}" class="px-4 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-white font-bold text-xs rounded-lg transition border border-slate-200 dark:border-slate-700">메시지</a>
                `;
            }

            if (!u.can_view_content) {
                document.getElementById('privateLockNotice').classList.remove('hidden');
                document.getElementById('profileTabsArea').classList.add('hidden');
                document.getElementById('myPostsGrid').classList.add('hidden');
            } else {
                document.getElementById('privateLockNotice').classList.add('hidden');
                document.getElementById('profileTabsArea').classList.remove('hidden');
                document.getElementById('myPostsGrid').classList.remove('hidden');
                switchTab('posts');
            }
        }

        // ✂️ 프로필 사진 변경 및 크롭
        function handleAvatarClick() {
            if (loggedInUser && loggedInUser === currentProfileUser) {
                document.getElementById('profileFileInput').click();
            }
        }

        function handleProfileFileSelect(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = (e) => {
                const img = document.getElementById('profileCropperImage');
                img.src = e.target.result;
                document.getElementById('profileCropperModal').classList.remove('hidden');

                if (profileCropperInstance) {
                    profileCropperInstance.destroy();
                    profileCropperInstance = null;
                }

                profileCropperInstance = new Cropper(img, {
                    aspectRatio: 1,
                    viewMode: 1,
                    autoCropArea: 0.9,
                    responsive: true
                });
            };
            reader.readAsDataURL(file);
        }

        function closeProfileCropperModal() {
            document.getElementById('profileCropperModal').classList.add('hidden');
            if (profileCropperInstance) {
                profileCropperInstance.destroy();
                profileCropperInstance = null;
            }
            document.getElementById('profileFileInput').value = '';
        }

        function profileCropperZoom(d) { if (profileCropperInstance) profileCropperInstance.zoom(d); }
        function profileCropperRotate(deg) { if (profileCropperInstance) profileCropperInstance.rotate(deg); }

        function saveCroppedProfileImage() {
            if (!profileCropperInstance) return;
            const btn = document.getElementById('saveProfileCropBtn');
            btn.disabled = true;
            btn.innerText = '저장 중...';

            profileCropperInstance.getCroppedCanvas({
                maxWidth: 600,
                maxHeight: 600
            }).toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'profile.jpg');

                fetch('/api/profile-image', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(d => {
                    if (d.status === 'success') {
                        closeProfileCropperModal();
                        document.getElementById('profileAvatarBox').innerHTML = `<img src="${d.profile_img}" class="w-full h-full object-cover">`;
                    } else {
                        alert(d.message || '프로필 사진 변경 실패');
                    }
                })
                .catch(err => alert('저장 중 오류 발생'))
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = '저장';
                });
            }, 'image/jpeg', 0.9);
        }

        // 📝 자기소개 모달
        function openBioModal() {
            document.getElementById('bioInput').value = document.getElementById('profileBio').innerText;
            document.getElementById('bioModal').classList.remove('hidden');
        }
        function closeBioModal() { document.getElementById('bioModal').classList.add('hidden'); }
        function saveBio() {
            const bio = document.getElementById('bioInput').value.trim();
            fetch('/api/profile-bio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bio })
            })
            .then(res => res.json())
            .then(d => {
                if (d.status === 'success') {
                    document.getElementById('profileBio').innerText = d.bio;
                    closeBioModal();
                } else {
                    alert(d.message);
                }
            });
        }

        // 👥 팔로워 / 팔로잉 목록 모달 (프로필 사진 포함)
        function openFollowModal(type) {
            const title = type === 'followers' ? '팔로워' : '팔로잉';
            document.getElementById('followListModalTitle').innerText = `${title} 목록`;
            const container = document.getElementById('followListContainer');
            container.innerHTML = '<p class="text-center text-slate-400 py-6">불러오는 중...</p>';
            document.getElementById('followListModal').classList.remove('hidden');

            fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/${type}`)
                .then(res => res.json())
                .then(d => {
                    container.innerHTML = '';
                    if (!d.users || d.users.length === 0) {
                        container.innerHTML = `<p class="text-center text-slate-400 py-6">${title}한 사용자가 없습니다.</p>`;
                        return;
                    }
                    d.users.forEach(u => {
                        const avatarHtml = u.profile_img ? `<img src="${u.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");
                        const row = document.createElement('a');
                        row.href = `/profile/${u.username}`;
                        row.className = "flex items-center gap-3 p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition font-bold";
                        row.innerHTML = `
                            <div class="w-9 h-9 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700 shrink-0 flex items-center justify-center">${avatarHtml}</div>
                            <span>@${escapeHtml(u.username)}</span>
                        `;
                        container.appendChild(row);
                    });
                });
        }
        function closeFollowModal() { document.getElementById('followListModal').classList.add('hidden'); }

        function switchTab(tab) {
            const pBtn = document.getElementById('tabPostsBtn');
            const lBtn = document.getElementById('tabLikesBtn');
            const bBtn = document.getElementById('tabBookmarksBtn');

            pBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";
            lBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";
            bBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";

            if (tab === 'posts') {
                pBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/posts/user/${encodeURIComponent(currentProfileUser)}`).then(r => r.json()).then(d => {
                    document.getElementById('postCount').innerText = d.posts ? d.posts.length : 0;
                    renderGrid(d.posts);
                });
            } else if (tab === 'likes') {
                lBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/liked-posts`).then(r => r.json()).then(d => renderGrid(d.posts));
            } else if (tab === 'bookmarks') {
                bBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/bookmarks`).then(r => r.json()).then(d => renderGrid(d.posts));
            }
        }

        function renderGrid(posts) {
            const grid = document.getElementById('myPostsGrid');
            grid.innerHTML = '';

            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-center py-16 text-slate-400 text-xs">게시물이 없습니다.</div>';
                return;
            }

            posts.forEach(p => {
                const card = document.createElement('div');
                card.className = "aspect-square bg-slate-100 dark:bg-slate-800 rounded-lg overflow-hidden relative border border-slate-200 dark:border-slate-700 cursor-pointer";
                card.onclick = () => openProfilePostDetail(p.id);

                const images = p.image_urls && p.image_urls.length > 0 ? p.image_urls : (p.image_url ? [p.image_url] : []);
                const firstImg = images.length > 0 ? images[0] : '';

                if (p.is_video && firstImg) {
                    card.innerHTML = `
                        <video src="${escapeHtml(firstImg)}" class="w-full h-full object-cover"></video>
                        <i class="fa-solid fa-play absolute top-2 right-2 text-white text-xs drop-shadow"></i>
                    `;
                } else if (firstImg) {
                    card.innerHTML = `<img src="${escapeHtml(firstImg)}" class="w-full h-full object-cover">`;
                } else {
                    card.innerHTML = `<div class="p-2 text-[10px] text-center flex items-center justify-center h-full break-all">${escapeHtml(p.content)}</div>`;
                }
                grid.appendChild(card);
            });
        }

        function openProfilePostDetail(postId) {
            fetch(`/api/posts/${postId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        const post = data.post;
                        const avatarBox = document.getElementById('profileModalUserAvatar');
                        if (post.profile_img) {
                            avatarBox.innerHTML = `<img src="${post.profile_img}" class="w-full h-full object-cover">`;
                        } else {
                            avatarBox.innerHTML = getDefaultAvatar("text-xs");
                        }

                        document.getElementById('profileModalUsername').innerText = `@${post.username}`;
                        document.getElementById('profileModalContent').innerText = post.content;

                        const editBtn = document.getElementById('profileModalEditPostBtn');
                        const delBtn = document.getElementById('profileModalDeletePostBtn');
                        
                        // 작성자 본인일 경우 수정 버튼 노출
                        if (loggedInUser && loggedInUser === post.username) {
                            editBtn.classList.remove('hidden');
                            editBtn.onclick = () => openEditPostModal(post.id, post.content);
                        } else {
                            editBtn.classList.add('hidden');
                        }

                        if (loggedInUser && (loggedInUser === post.username || loggedInUser === 'admin')) {
                            delBtn.classList.remove('hidden');
                            delBtn.onclick = () => deletePostFromProfile(post.id);
                        } else {
                            delBtn.classList.add('hidden');
                        }

                        const imgArea = document.getElementById('profileModalImageArea');
                        const images = post.image_urls && post.image_urls.length > 0 ? post.image_urls : (post.image_url ? [post.image_url] : []);
                        
                        if (post.is_video && images.length > 0) {
                            imgArea.innerHTML = `<video src="${escapeHtml(images[0])}" controls autoplay playsinline class="w-full max-h-[350px]"></video>`;
                        } else if (images.length > 0) {
                            imgArea.innerHTML = `<img src="${escapeHtml(images[0])}" class="w-full max-h-[350px] object-contain">`;
                        } else {
                            imgArea.innerHTML = `<div class="text-white text-xs p-6 text-center">${escapeHtml(post.content)}</div>`;
                        }

                        const submitBtn = document.getElementById('profileModalCommentSubmitBtn');
                        submitBtn.onclick = () => submitProfileModalComment(post.id);

                        loadProfileModalComments(post.id);
                        document.getElementById('profilePostDetailModal').classList.remove('hidden');
                    }
                });
        }

        function closeProfilePostDetailModal() {
            document.getElementById('profilePostDetailModal').classList.add('hidden');
        }

        // ✏️ 게시글 수정 모달 열기/닫기 및 저장
        function openEditPostModal(postId, currentContent) {
            document.getElementById('editPostContentInput').value = currentContent;
            document.getElementById('saveEditPostBtn').onclick = () => submitEditPost(postId);
            document.getElementById('editPostModal').classList.remove('hidden');
        }

        function closeEditPostModal() {
            document.getElementById('editPostModal').classList.add('hidden');
        }

        function submitEditPost(postId) {
            const content = document.getElementById('editPostContentInput').value.trim();
            const btn = document.getElementById('saveEditPostBtn');
            btn.disabled = true;
            btn.innerText = '수정 중...';

            fetch(`/api/posts/${postId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            })
            .then(res => res.json())
            .then(d => {
                if (d.status === 'success') {
                    document.getElementById('profileModalContent').innerText = d.content;
                    closeEditPostModal();
                    switchTab('posts');
                } else {
                    alert(d.message || '수정 실패');
                }
            })
            .catch(err => alert('게시글 수정 중 오류 발생'))
            .finally(() => {
                btn.disabled = false;
                btn.innerText = '수정 완료';
            });
        }

        function deletePostFromProfile(postId) {
            if (!confirm('정말로 이 게시글을 삭제하시겠습니까?')) return;
            fetch(`/api/posts/${postId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(d => {
                    if (d.status === 'success') {
                        closeProfilePostDetailModal();
                        switchTab('posts');
                    } else {
                        alert(d.message);
                    }
                });
        }

        function loadProfileModalComments(postId) {
            fetch(`/api/comments/${postId}`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('profileModalCommentsList');
                    list.innerHTML = '';
                    if (data.status === 'success') {
                        data.comments.forEach(c => {
                            const p = document.createElement('div');
                            p.className = "flex items-center justify-between";
                            p.innerHTML = `
                                <span><strong class="text-slate-900 dark:text-white">@${escapeHtml(c.username)}</strong> ${escapeHtml(c.content)}</span>
                                ${loggedInUser === c.username || loggedInUser === 'admin' ? `
                                    <button onclick="deleteCommentFromProfile(${c.id}, ${postId})" class="text-slate-400 hover:text-red-500 text-[10px] ml-2"><i class="fa-solid fa-xmark"></i></button>
                                ` : ''}
                            `;
                            list.appendChild(p);
                        });
                    }
                });
        }

        function submitProfileModalComment(postId) {
            if (!loggedInUser) { alert('로그인이 필요합니다.'); return; }
            const input = document.getElementById('profileModalCommentInput');
            if (!input.value.trim()) return;

            fetch('/api/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id: postId, content: input.value.trim() })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    loadProfileModalComments(postId);
                    input.value = '';
                }
            });
        }

        function deleteCommentFromProfile(commentId, postId) {
            fetch(`/api/comments/${commentId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => { if (data.status === 'success') loadProfileModalComments(postId); });
        }

        function handleFollowToggle(target, btn) {
            if (!loggedInUser) { window.location.href = '/'; return; }
            fetch(`/api/follow/${encodeURIComponent(target)}`, { method: 'POST' })
                .then(res => res.json())
                .then(d => {
                    if (d.result_status === 'following') {
                        btn.innerText = '팔로잉';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
                    } else if (d.result_status === 'requested') {
                        btn.innerText = '요청됨';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700';
                    } else {
                        btn.innerText = '팔로우';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-blue-500 hover:bg-blue-600 text-white';
                    }
                    document.getElementById('followerCount').innerText = d.follower_count;
                });
        }

        function togglePrivateSetting(isPrivate) {
            fetch('/api/profile-privacy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_private: isPrivate })
            });
        }

        // ⚙️ 환경설정 하위 모달 제어
        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        function openChangeUsernameModal() {
            closeSettingsModal();
            document.getElementById('changeUsernameModal').classList.remove('hidden');
        }
        function closeChangeUsernameModal() { document.getElementById('changeUsernameModal').classList.add('hidden'); }
        function submitChangeUsername() {
            const newUsername = document.getElementById('newUsernameInput').value.trim();
            if (!newUsername) { alert('아이디를 입력해 주세요.'); return; }
            fetch('/api/change-username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_username: newUsername })
            })
            .then(res => res.json())
            .then(d => {
                if (d.status === 'success') {
                    alert('아이디가 성공적으로 변경되었습니다!');
                    window.location.href = `/profile/${d.new_username}`;
                } else {
                    alert(d.message);
                }
            });
        }

        function openChangePasswordModal() {
            closeSettingsModal();
            document.getElementById('changePasswordModal').classList.remove('hidden');
        }
        function closeChangePasswordModal() { document.getElementById('changePasswordModal').classList.add('hidden'); }
        function submitChangePassword() {
            const current_password = document.getElementById('currentPasswordInput').value.trim();
            const new_password = document.getElementById('newPasswordInput').value.trim();
            if (!current_password || !new_password) { alert('비밀번호를 입력해 주세요.'); return; }
            fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ current_password, new_password })
            })
            .then(res => res.json())
            .then(d => {
                if (d.status === 'success') {
                    alert('비밀번호가 변경되었습니다!');
                    closeChangePasswordModal();
                } else {
                    alert(d.message);
                }
            });
        }

        function openDeleteAccountModal() {
            closeSettingsModal();
            document.getElementById('deleteAccountModal').classList.remove('hidden');
        }
        function closeDeleteAccountModal() { document.getElementById('deleteAccountModal').classList.add('hidden'); }
        function submitDeleteAccount() {
            const password = document.getElementById('deleteAccountPasswordInput').value.trim();
            if (!password) { alert('비밀번호를 입력해 주세요.'); return; }
            if (!confirm('정말로 탈퇴하시겠습니까? 탈퇴 후 데이터는 복구할 수 없습니다.')) return;
            fetch('/api/delete-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            })
            .then(res => res.json())
            .then(d => {
                if (d.status === 'success') {
                    alert('회원 탈퇴가 완료되었습니다.');
                    window.location.href = '/';
                } else {
                    alert(d.message);
                }
            });
        }

        function logout() { fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/'); }
        function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>

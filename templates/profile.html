<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>프로필 • Woongstagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { -webkit-text-size-adjust: none; touch-action: manipulation; }
        .story-badge { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between transition-colors pb-16 md:pb-0">

    <!-- Header Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="text-xl sm:text-2xl font-black italic font-serif text-slate-900 dark:text-white select-none">
                Woongstagram
            </a>
            <div class="flex items-center gap-4 sm:gap-5 text-lg sm:text-xl text-slate-800 dark:text-slate-200">
                <button onclick="toggleDarkMode()" class="p-1 hover:text-amber-500 transition" title="테마 변경">
                    <i id="themeIcon" class="fa-regular fa-moon"></i>
                </button>
                <a href="/" title="홈"><i class="fa-solid fa-house"></i></a>
                <a href="/profile" class="font-bold text-blue-500" title="프로필"><i class="fa-solid fa-user"></i></a>
            </div>
        </div>
    </header>

    <!-- Profile Main Section -->
    <main class="max-w-4xl mx-auto px-4 py-6 sm:py-8 w-full flex-1">
        <div id="profileHeader" class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-8 pb-6 sm:pb-8 border-b border-slate-200 dark:border-slate-800">
            <!-- 프로필 사진 & 사진 변경 버튼 -->
            <div class="relative group shrink-0">
                <div id="profileAvatarBox" class="w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center font-bold shadow-md overflow-hidden bg-white dark:bg-slate-900">
                    <i class="fa-solid fa-user text-3xl sm:text-4xl text-slate-400"></i>
                </div>
                <div id="profileImageUploadBtn" class="hidden absolute inset-0 rounded-full bg-black/40 cursor-pointer flex-col items-center justify-center text-white opacity-0 group-hover:opacity-100 transition">
                    <i class="fa-solid fa-camera text-lg mb-1"></i>
                    <span class="text-[10px] font-semibold">사진 변경</span>
                </div>
                <input type="file" id="profileImageInput" accept="image/*" class="hidden" onchange="uploadProfileImage(this)">
            </div>

            <!-- 프로필 상세 정보 -->
            <div class="flex flex-col gap-3 sm:gap-4 text-center sm:text-left flex-1 w-full">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 justify-center sm:justify-start">
                    <h1 id="profileUsername" class="text-lg sm:text-xl font-bold">@username</h1>
                    
                    <button id="viewMyStoryBtn" onclick="openMyStoryModal()" class="hidden px-3 py-1 text-white font-bold text-xs rounded-full shadow-sm hover:opacity-90 transition items-center gap-1.5 self-center sm:self-auto story-badge">
                        <i class="fa-solid fa-circle-play text-xs"></i> 스토리 보기
                    </button>

                    <div id="profileActionArea" class="flex items-center justify-center sm:justify-start gap-2"></div>
                </div>

                <!-- 숫자 통계 (팔로워/팔로잉 팝업 연결) -->
                <div class="flex justify-center sm:justify-start gap-6 sm:gap-8 text-xs sm:text-sm">
                    <div>게시물 <span id="postCount" class="font-bold">0</span></div>
                    <div onclick="openFollowListModal('followers')" class="cursor-pointer hover:underline">팔로워 <span id="followerCount" class="font-bold">0</span></div>
                    <div onclick="openFollowListModal('following')" class="cursor-pointer hover:underline">팔로우 <span id="followingCount" class="font-bold">0</span></div>
                </div>

                <!-- 📝 자기소개 -->
                <div class="text-xs space-y-1 mt-1">
                    <p id="profileEmail" class="text-slate-400 text-[11px]"></p>
                    <div class="flex items-center justify-center sm:justify-start gap-2">
                        <p id="profileBio" class="font-medium whitespace-pre-wrap break-all"></p>
                        <button id="editBioBtn" onclick="openEditBioModal()" class="hidden text-slate-400 hover:text-blue-500 transition text-xs shrink-0" title="자기소개 수정">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🔒 비공개 계정 잠금 안내 -->
        <div id="privateLockNotice" class="hidden text-center py-20">
            <i class="fa-solid fa-lock text-4xl text-slate-400 mb-3"></i>
            <h3 class="font-bold text-sm">비공개 계정입니다</h3>
            <p class="text-xs text-slate-500 mt-1">사진과 동영상을 보려면 팔로우 요청을 보내세요.</p>
        </div>

        <!-- 탭 메뉴 (게시물 / 좋아요 / 저장됨) -->
        <div id="profileTabsArea" class="flex justify-center border-t border-slate-200 dark:border-slate-800 -mt-[1px] gap-6 sm:gap-12">
            <button onclick="switchTab('posts')" id="tabPostsBtn" class="flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider">
                <i class="fa-solid fa-table-cells text-sm"></i> 게시물
            </button>
            <button onclick="switchTab('likes')" id="tabLikesBtn" class="hidden items-center gap-2 py-3 border-t-2 border-transparent font-semibold text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 tracking-wider">
                <i class="fa-solid fa-heart text-sm"></i> 좋아요
            </button>
            <button onclick="switchTab('bookmarks')" id="tabBookmarksBtn" class="hidden items-center gap-2 py-3 border-t-2 border-transparent font-semibold text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 tracking-wider">
                <i class="fa-solid fa-bookmark text-sm"></i> 저장됨
            </button>
        </div>

        <div id="myPostsGrid" class="grid grid-cols-3 gap-1 sm:gap-4 mt-2"></div>
    </main>

    <!-- 📱 모바일 하단 전용 내비게이션 바 -->
    <nav class="fixed bottom-0 left-0 right-0 h-12 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 z-40 flex items-center justify-around text-lg text-slate-800 dark:text-slate-200 md:hidden">
        <a href="/" class="p-2 hover:text-blue-500"><i class="fa-solid fa-house"></i></a>
        <a href="/profile" class="p-2 text-blue-500"><i class="fa-solid fa-user"></i></a>
    </nav>

    <!-- 📝 1. 자기소개 수정 모달 (30자 제한) -->
    <div id="editBioModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeEditBioModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">자기소개 수정 (30자 이내)</h3>
            <div class="space-y-3 text-xs">
                <div class="relative">
                    <textarea id="bioInput" rows="2" maxlength="30" oninput="updateBioCharCount(this)" placeholder="자기소개를 입력하세요 (최대 30자)" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white resize-none"></textarea>
                    <span id="bioCharCount" class="absolute right-2 bottom-2 text-[10px] text-slate-400">0/30</span>
                </div>
                <button onclick="submitProfileBio()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition mt-2">저장하기</button>
            </div>
        </div>
    </div>

    <!-- ⚙️ 2. 환경설정 모달 (비공개 스위치, 아이디/비밀번호 변경, 탈퇴 전체 복구) -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl relative text-center text-xs divide-y divide-slate-100 dark:divide-slate-800 border border-slate-200 dark:border-slate-800">
            <div class="py-4 font-bold text-sm">환경설정</div>
            
            <div class="p-3.5 flex items-center justify-between px-6">
                <span class="font-semibold flex items-center gap-2"><i class="fa-solid fa-lock text-slate-400"></i> 비공개 계정</span>
                <input type="checkbox" id="privateAccountSwitch" onchange="togglePrivateSetting(this.checked)" class="w-4 h-4 cursor-pointer">
            </div>

            <button onclick="openChangeUsernameModal()" class="w-full py-3.5 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold flex items-center justify-center gap-2">
                <i class="fa-solid fa-at text-slate-400"></i> 아이디 변경
            </button>

            <button onclick="openChangePasswordModal()" class="w-full py-3.5 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold flex items-center justify-center gap-2">
                <i class="fa-solid fa-key text-slate-400"></i> 비밀번호 변경
            </button>

            <button onclick="logout()" class="w-full py-3.5 text-slate-700 dark:text-slate-300 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-from-bracket text-slate-400"></i> 로그아웃
            </button>

            <button onclick="openDeleteAccountModal()" id="deleteAccountBtn" class="w-full py-3.5 text-red-500 font-bold hover:bg-red-50 dark:hover:bg-red-950/40 flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-xmark"></i> 회원 탈퇴
            </button>

            <button onclick="closeSettingsModal()" class="w-full py-3.5 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold">
                닫기
            </button>
        </div>
    </div>

    <!-- 🆔 2-1. 아이디 변경 모달 -->
    <div id="changeUsernameModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeChangeUsernameModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-2">아이디 변경</h3>
            <div class="p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-lg mb-4 text-[11px] text-amber-800 dark:text-amber-200 leading-relaxed">
                <i class="fa-solid fa-circle-exclamation mr-1 text-amber-600"></i>
                <strong>주의:</strong> 아이디를 변경하면 **30일 동안 다시 변경할 수 없습니다.**
            </div>
            <div class="space-y-3 text-xs">
                <input type="text" id="newUsernameInput" placeholder="새로운 사용자 이름 (아이디)" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <button onclick="submitChangeUsername()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition mt-2">아이디 변경하기</button>
            </div>
        </div>
    </div>

    <!-- 🔑 2-2. 비밀번호 변경 모달 -->
    <div id="changePwModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeChangePwModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">비밀번호 변경</h3>
            <div class="space-y-3 text-xs">
                <input type="password" id="currentPasswordInput" placeholder="현재 비밀번호" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <input type="password" id="newPasswordInput" placeholder="새로운 비밀번호" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <input type="password" id="newPasswordConfirmInput" placeholder="새로운 비밀번호 확인" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <button onclick="submitChangePassword()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition mt-2">변경 완료</button>
            </div>
        </div>
    </div>

    <!-- 🚨 2-3. 회원 탈퇴 확인 모달 -->
    <div id="deleteAccModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeDeleteAccModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center text-red-600 border-b border-slate-100 dark:border-slate-800 pb-3 mb-2">회원 탈퇴</h3>
            <p class="text-[11px] text-slate-500 mb-4 text-center leading-relaxed">정말로 탈퇴하시겠습니까?<br>작성하신 게시물, 댓글, 스토리가 **모두 영구 삭제**됩니다.</p>
            <div class="space-y-3 text-xs">
                <input type="password" id="deleteAccPasswordInput" placeholder="비밀번호 확인" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <button onclick="submitDeleteAccount()" class="w-full py-2.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg transition mt-2">계정 삭제 및 탈퇴하기</button>
            </div>
        </div>
    </div>

    <!-- 👥 3. 팔로워 / 팔로잉 목록 모달 -->
    <div id="followListModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeFollowListModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 id="followListTitle" class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">팔로워</h3>
            <div id="followUsersContainer" class="space-y-3 text-xs max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <!-- 🎬 4. 내 스토리 뷰어 모달 -->
    <div id="storyModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center">
        <button onclick="closeStoryModal()" class="absolute top-5 right-5 text-white text-2xl hover:text-slate-400 z-50"><i class="fa-solid fa-xmark"></i></button>
        <div class="w-full max-w-sm h-[580px] bg-slate-900 rounded-2xl overflow-hidden relative flex flex-col justify-between shadow-2xl border border-slate-800">
            <div class="p-4 z-10 bg-gradient-to-b from-black/80 to-transparent flex justify-between items-center text-white text-xs">
                <span id="storyUser" class="font-bold">username</span>
                <button id="storyDeleteBtn" class="text-white/70 hover:text-red-400"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div id="storyBg" class="absolute inset-0 flex flex-col items-center justify-end text-white p-6 pb-16 text-center bg-cover bg-center">
                <p id="storyDesc" class="text-lg font-bold text-white drop-shadow"></p>
            </div>
        </div>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const targetUserFromUrl = pathParts.length > 2 && pathParts[2] ? decodeURIComponent(pathParts[2]) : null;
        let currentProfileUser = null;
        let loggedInUser = null;
        let myActiveStory = null;
        let currentBioText = '';

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                const tIcon = document.getElementById('themeIcon');
                if (tIcon) tIcon.className = 'fa-regular fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                const tIcon = document.getElementById('themeIcon');
                if (tIcon) tIcon.className = 'fa-regular fa-moon';
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                const tIcon = document.getElementById('themeIcon');
                if (tIcon) tIcon.className = 'fa-regular fa-moon';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                const tIcon = document.getElementById('themeIcon');
                if (tIcon) tIcon.className = 'fa-regular fa-sun';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            initProfile();
        });

        async function initProfile() {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();
            if (meData.logged_in) loggedInUser = meData.username;

            let targetUser = targetUserFromUrl || (meData.logged_in ? meData.username : null);
            if (!targetUser) { window.location.href = '/'; return; }
            currentProfileUser = targetUser;

            const userRes = await fetch(`/api/users/${encodeURIComponent(targetUser)}`);
            const userData = await userRes.json();
            if (userData.status !== 'success') { alert('사용자를 찾을 수 없습니다.'); window.location.href = '/'; return; }

            const u = userData.user;
            document.getElementById('profileUsername').innerText = `@${u.username}`;
            document.getElementById('followerCount').innerText = u.follower_count;
            document.getElementById('followingCount').innerText = u.following_count;
            
            currentBioText = u.bio || '';
            document.getElementById('profileBio').innerText = currentBioText || (meData.logged_in && meData.username === u.username ? '자기소개를 추가해 보세요.' : '');

            const avatarBox = document.getElementById('profileAvatarBox');
            if (u.profile_img) {
                avatarBox.innerHTML = `<img src="${u.profile_img}" class="w-full h-full object-cover">`;
            } else {
                avatarBox.innerHTML = `<i class="fa-solid fa-user text-3xl sm:text-4xl text-slate-400"></i>`;
            }

            const isMyProfile = meData.logged_in && (meData.username === u.username);
            const actionArea = document.getElementById('profileActionArea');
            const uploadBtn = document.getElementById('profileImageUploadBtn');
            const editBioBtn = document.getElementById('editBioBtn');

            if (isMyProfile) {
                document.getElementById('profileEmail').innerText = u.email;
                uploadBtn.classList.remove('hidden');
                uploadBtn.classList.add('flex');
                uploadBtn.onclick = () => document.getElementById('profileImageInput').click();

                editBioBtn.classList.remove('hidden');
                document.getElementById('tabLikesBtn').classList.remove('hidden');
                document.getElementById('tabLikesBtn').classList.add('flex');
                document.getElementById('tabBookmarksBtn').classList.remove('hidden');
                document.getElementById('tabBookmarksBtn').classList.add('flex');
                document.getElementById('privateAccountSwitch').checked = u.is_private;

                actionArea.innerHTML = `
                    <button onclick="openSettingsModal()" class="p-2 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-base" title="환경설정"><i class="fa-solid fa-gear"></i></button>
                `;
            } else {
                uploadBtn.classList.add('hidden');
                uploadBtn.classList.remove('flex');
                editBioBtn.classList.add('hidden');
                document.getElementById('tabLikesBtn').classList.add('hidden');
                document.getElementById('tabLikesBtn').classList.remove('flex');
                document.getElementById('tabBookmarksBtn').classList.add('hidden');
                document.getElementById('tabBookmarksBtn').classList.remove('flex');

                let btnText = '팔로우';
                let btnClass = 'bg-blue-500 hover:bg-blue-600 text-white';

                if (u.is_following) {
                    btnText = '팔로잉';
                    btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
                } else if (u.is_requested) {
                    btnText = '요청됨';
                    btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700';
                }

                actionArea.innerHTML = `
                    <button onclick="handleFollowToggle('${escapeHtml(u.username)}', this)" class="px-4 py-1.5 font-bold text-xs rounded-lg transition ${btnClass}">${btnText}</button>
                    <a href="/?dm=${encodeURIComponent(u.username)}" class="px-4 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-white font-bold text-xs rounded-lg transition border border-slate-200 dark:border-slate-700">메시지</a>
                `;
            }

            checkActiveStory(u.username, u.profile_img);

            if (!u.can_view_content) {
                document.getElementById('privateLockNotice').classList.remove('hidden');
                document.getElementById('profileTabsArea').classList.add('hidden');
                document.getElementById('myPostsGrid').classList.add('hidden');
            } else {
                document.getElementById('privateLockNotice').classList.add('hidden');
                document.getElementById('profileTabsArea').classList.remove('hidden');
                document.getElementById('myPostsGrid').classList.remove('hidden');
                switchTab('posts');
            }
        }

        function switchTab(tab) {
            const pBtn = document.getElementById('tabPostsBtn');
            const lBtn = document.getElementById('tabLikesBtn');
            const bBtn = document.getElementById('tabBookmarksBtn');

            pBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";
            lBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";
            bBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";

            if (tab === 'posts') {
                pBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/posts/user/${encodeURIComponent(currentProfileUser)}`).then(r => r.json()).then(d => renderGrid(d.posts));
            } else if (tab === 'likes') {
                lBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/liked-posts`).then(r => r.json()).then(d => renderGrid(d.posts));
            } else if (tab === 'bookmarks') {
                bBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/bookmarks`).then(r => r.json()).then(d => renderGrid(d.posts));
            }
        }

        function renderGrid(posts) {
            const grid = document.getElementById('myPostsGrid');
            grid.innerHTML = '';
            document.getElementById('postCount').innerText = posts ? posts.length : 0;

            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-center py-16 text-slate-400 text-xs">게시물이 없습니다.</div>';
                return;
            }

            posts.forEach(p => {
                const card = document.createElement('div');
                card.className = "aspect-square bg-slate-100 dark:bg-slate-800 rounded-lg overflow-hidden relative border border-slate-200 dark:border-slate-700 cursor-pointer";
                card.onclick = () => window.location.href = `/?post=${p.id}`;

                const images = p.image_urls && p.image_urls.length > 0 ? p.image_urls : (p.image_url ? [p.image_url] : []);
                const firstImg = images.length > 0 ? images[0] : '';

                if (p.is_video && firstImg) {
                    card.innerHTML = `<video src="${escapeHtml(firstImg)}" class="w-full h-full object-cover"></video><i class="fa-solid fa-play absolute top-2 right-2 text-white text-xs drop-shadow"></i>`;
                } else if (firstImg) {
                    card.innerHTML = `<img src="${escapeHtml(firstImg)}" class="w-full h-full object-cover">`;
                } else {
                    card.innerHTML = `<div class="p-2 text-[10px] text-center flex items-center justify-center h-full break-all">${escapeHtml(p.content)}</div>`;
                }
                grid.appendChild(card);
            });
        }

        // 📝 자기소개 편집 모달 함수
        function openEditBioModal() {
            const input = document.getElementById('bioInput');
            input.value = currentBioText;
            updateBioCharCount(input);
            document.getElementById('editBioModal').classList.remove('hidden');
        }
        function closeEditBioModal() { document.getElementById('editBioModal').classList.add('hidden'); }
        function updateBioCharCount(input) { document.getElementById('bioCharCount').innerText = `${input.value.length}/30`; }
        function submitProfileBio() {
            const bio = document.getElementById('bioInput').value.trim();
            if (bio.length > 30) { alert('자기소개는 30자 이내로 작성해 주세요.'); return; }
            fetch('/api/profile-bio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bio })
            }).then(r => r.json()).then(d => {
                if (d.status === 'success') {
                    currentBioText = d.bio;
                    document.getElementById('profileBio').innerText = d.bio || '자기소개를 추가해 보세요.';
                    closeEditBioModal();
                } else alert(d.message);
            });
        }

        // 📸 프로필 사진 업로드
        function uploadProfileImage(input) {
            if (input.files.length === 0) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);
            fetch('/api/profile-image', { method: 'POST', body: formData })
                .then(r => r.json()).then(d => {
                    if (d.status === 'success') {
                        document.getElementById('profileAvatarBox').innerHTML = `<img src="${d.profile_img}" class="w-full h-full object-cover">`;
                    } else alert(d.message);
                });
        }

        // ⚙️ 환경설정 관련 함수들
        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
        function togglePrivateSetting(isPrivate) {
            fetch('/api/profile-privacy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_private: isPrivate })
            });
        }

        function openChangeUsernameModal() { closeSettingsModal(); document.getElementById('changeUsernameModal').classList.remove('hidden'); }
        function closeChangeUsernameModal() { document.getElementById('changeUsernameModal').classList.add('hidden'); }
        function submitChangeUsername() {
            const newUsername = document.getElementById('newUsernameInput').value.trim();
            if (!newUsername) { alert('새로운 아이디를 입력해 주세요.'); return; }
            fetch('/api/change-username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_username: newUsername })
            }).then(r => r.json()).then(d => {
                if (d.status === 'success') {
                    alert('아이디가 변경되었습니다!');
                    window.location.href = `/profile/${d.new_username}`;
                } else alert(d.message);
            });
        }

        function openChangePasswordModal() { closeSettingsModal(); document.getElementById('changePwModal').classList.remove('hidden'); }
        function closeChangePwModal() { document.getElementById('changePwModal').classList.add('hidden'); }
        function submitChangePassword() {
            const cur = document.getElementById('currentPasswordInput').value.trim();
            const np = document.getElementById('newPasswordInput').value.trim();
            const npc = document.getElementById('newPasswordConfirmInput').value.trim();
            if (!cur || !np || !npc) { alert('모든 항목을 입력해 주세요.'); return; }
            if (np !== npc) { alert('새 비밀번호가 일치하지 않습니다.'); return; }
            fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ current_password: cur, new_password: np })
            }).then(r => r.json()).then(d => {
                if (d.status === 'success') { alert('비밀번호가 변경되었습니다!'); closeChangePwModal(); }
                else alert(d.message);
            });
        }

        function openDeleteAccountModal() { closeSettingsModal(); document.getElementById('deleteAccModal').classList.remove('hidden'); }
        function closeDeleteAccModal() { document.getElementById('deleteAccModal').classList.add('hidden'); }
        function submitDeleteAccount() {
            const pw = document.getElementById('deleteAccPasswordInput').value.trim();
            if (!pw) { alert('비밀번호를 입력해 주세요.'); return; }
            fetch('/api/delete-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw })
            }).then(r => r.json()).then(d => {
                if (d.status === 'success') { alert('회원 탈퇴가 완료되었습니다.'); window.location.href = '/'; }
                else alert(d.message);
            });
        }

        // 👥 팔로워 / 팔로잉 팝업
        function openFollowListModal(type) {
            const title = type === 'followers' ? '팔로워' : '팔로우';
            document.getElementById('followListTitle').innerText = title;
            const container = document.getElementById('followUsersContainer');
            container.innerHTML = '<div class="text-center text-slate-400">로딩 중...</div>';
            document.getElementById('followListModal').classList.remove('hidden');

            fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/${type}`).then(r => r.json()).then(d => {
                container.innerHTML = '';
                if (d.status === 'success') {
                    if (d.users.length === 0) {
                        container.innerHTML = `<div class="text-center text-slate-400 py-4">${title} 목록이 없습니다.</div>`;
                        return;
                    }
                    d.users.forEach(u => {
                        const div = document.createElement('div');
                        div.className = "flex items-center justify-between py-1";
                        div.innerHTML = `
                            <a href="/profile/${u}" class="font-bold hover:underline">@${escapeHtml(u)}</a>
                            <a href="/profile/${u}" class="text-blue-500 font-semibold text-[11px]">프로필</a>
                        `;
                        container.appendChild(div);
                    });
                }
            });
        }
        function closeFollowListModal() { document.getElementById('followListModal').classList.add('hidden'); }

        // 🎬 스토리 확인 및 뷰어
        async function checkActiveStory(username, profileImg) {
            fetch('/api/stories').then(r => r.json()).then(d => {
                if (d.status === 'success') {
                    const story = d.stories.find(s => s.username === username);
                    const viewBtn = document.getElementById('viewMyStoryBtn');
                    if (story) {
                        myActiveStory = story;
                        viewBtn.classList.remove('hidden');
                        viewBtn.classList.add('flex');
                    } else {
                        viewBtn.classList.add('hidden');
                    }
                }
            });
        }
        function openMyStoryModal() {
            if (!myActiveStory) return;
            document.getElementById('storyUser').innerText = `@${myActiveStory.username}`;
            document.getElementById('storyDesc').innerText = myActiveStory.desc || '';
            const bg = document.getElementById('storyBg');
            if (myActiveStory.image_url) bg.style.backgroundImage = `url('${myActiveStory.image_url}')`;
            document.getElementById('storyModal').classList.remove('hidden');
        }
        function closeStoryModal() { document.getElementById('storyModal').classList.add('hidden'); }

        function handleFollowToggle(target, btn) {
            if (!loggedInUser) { window.location.href = '/'; return; }
            fetch(`/api/follow/${encodeURIComponent(target)}`, { method: 'POST' })
                .then(res => res.json()).then(d => {
                    if (d.result_status === 'following') btn.innerText = '팔로잉';
                    else if (d.result_status === 'requested') btn.innerText = '요청됨';
                    else btn.innerText = '팔로우';
                    document.getElementById('followerCount').innerText = d.follower_count;
                });
        }

        function logout() { fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/'); }
        function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>

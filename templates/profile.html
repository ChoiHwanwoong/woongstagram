<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>프로필 • Woongstagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { -webkit-text-size-adjust: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between transition-colors pb-16 md:pb-0">

    <!-- 🔝 Header Navigation -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="text-xl sm:text-2xl font-black italic font-serif text-slate-900 dark:text-white select-none">
                Woongstagram
            </a>
            <div class="flex items-center gap-4 sm:gap-5 text-lg sm:text-xl text-slate-800 dark:text-slate-200">
                <button onclick="toggleDarkMode()" class="p-1 hover:text-amber-500 transition" title="테마 변경">
                    <i id="themeIconPC" class="fa-regular fa-moon"></i>
                </button>
                <a href="/" title="홈"><i class="fa-solid fa-house"></i></a>
                <a href="/profile" class="font-bold text-blue-500" title="프로필"><i class="fa-solid fa-user"></i></a>
            </div>
        </div>
    </header>

    <!-- 👤 Profile Main Section -->
    <main class="max-w-4xl mx-auto px-4 py-6 sm:py-8 w-full flex-1">
        <div id="profileHeader" class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-8 pb-6 sm:pb-8 border-b border-slate-200 dark:border-slate-800">
            <!-- 프로필 사진 (내 프로필일 때 클릭하여 변경 가능) -->
            <div class="relative group shrink-0">
                <div id="profileAvatarBox" onclick="triggerProfileImageUpload()" class="w-24 h-24 sm:w-36 sm:h-36 rounded-full bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center font-bold shadow-md overflow-hidden cursor-pointer relative">
                    <i class="fa-solid fa-user text-3xl sm:text-4xl text-slate-400"></i>
                </div>
                <div id="avatarEditOverlay" class="hidden absolute inset-0 bg-black/40 rounded-full flex items-center justify-center text-white text-xs font-bold pointer-events-none opacity-0 group-hover:opacity-100 transition">
                    <i class="fa-solid fa-camera mr-1"></i> 변경
                </div>
                <input type="file" id="profileImageInput" accept="image/*" class="hidden" onchange="handleProfileImageFile(this)">
            </div>

            <div class="flex flex-col gap-3 sm:gap-4 text-center sm:text-left flex-1 w-full">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 justify-center sm:justify-start">
                    <h1 id="profileUsername" class="text-lg sm:text-xl font-bold">@username</h1>
                    <div id="profileActionArea" class="flex items-center justify-center sm:justify-start gap-2"></div>
                </div>

                <!-- 👥 팔로워 / 팔로잉 숫자 클릭 시 모달 오픈 -->
                <div class="flex justify-center sm:justify-start gap-6 sm:gap-8 text-xs sm:text-sm">
                    <div>게시물 <span id="postCount" class="font-bold">0</span></div>
                    <div onclick="openFollowModal('followers')" class="cursor-pointer hover:underline">팔로워 <span id="followerCount" class="font-bold">0</span></div>
                    <div onclick="openFollowModal('following')" class="cursor-pointer hover:underline">팔로우 <span id="followingCount" class="font-bold">0</span></div>
                </div>

                <!-- 📝 자기소개 & 이메일 -->
                <div class="text-xs space-y-1 mt-1">
                    <p id="profileEmail" class="text-slate-400 text-[11px]"></p>
                    <p id="profileBio" class="font-medium whitespace-pre-wrap break-all text-slate-800 dark:text-slate-200"></p>
                </div>
            </div>
        </div>

        <!-- 🔒 비공개 계정 잠금 안내 -->
        <div id="privateLockNotice" class="hidden text-center py-20">
            <i class="fa-solid fa-lock text-4xl text-slate-400 mb-3"></i>
            <h3 class="font-bold text-sm">비공개 계정입니다</h3>
            <p class="text-xs text-slate-500 mt-1">사진과 동영상을 보려면 팔로우 요청을 보내세요.</p>
        </div>

        <!-- 📑 탭 메뉴 (게시물 / 좋아요 / 저장됨) -->
        <div id="profileTabsArea" class="flex justify-center border-t border-slate-200 dark:border-slate-800 -mt-[1px] gap-6 sm:gap-12">
            <button onclick="switchTab('posts')" id="tabPostsBtn" class="flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider">
                <i class="fa-solid fa-table-cells text-sm"></i> 게시물
            </button>
            <button onclick="switchTab('likes')" id="tabLikesBtn" class="hidden items-center gap-2 py-3 border-t-2 border-transparent font-semibold text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 tracking-wider">
                <i class="fa-solid fa-heart text-sm"></i> 좋아요
            </button>
            <button onclick="switchTab('bookmarks')" id="tabBookmarksBtn" class="hidden items-center gap-2 py-3 border-t-2 border-transparent font-semibold text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 tracking-wider">
                <i class="fa-solid fa-bookmark text-sm"></i> 저장됨
            </button>
        </div>

        <!-- 🖼️ 게시물 그리드 -->
        <div id="myPostsGrid" class="grid grid-cols-3 gap-1 sm:gap-4 mt-2"></div>
    </main>

    <!-- 📱 모바일 하단 전용 내비게이션 바 -->
    <nav class="fixed bottom-0 left-0 right-0 h-12 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 z-40 flex items-center justify-around text-lg text-slate-800 dark:text-slate-200 md:hidden">
        <a href="/" class="p-2 hover:text-blue-500"><i class="fa-solid fa-house"></i></a>
        <button onclick="toggleDarkMode()" class="p-2 hover:text-amber-500"><i id="themeIconMobile" class="fa-regular fa-moon"></i></button>
        <a href="/profile" class="p-2 text-blue-500"><i class="fa-solid fa-user"></i></a>
    </nav>

    <!-- 👥 팔로워 / 팔로잉 유저 목록 모달 -->
    <div id="followModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl relative flex flex-col max-h-[70vh] border border-slate-200 dark:border-slate-800">
            <div class="h-12 border-b border-slate-100 dark:border-slate-800 px-4 flex items-center justify-between shrink-0">
                <span id="followModalTitle" class="font-bold text-sm">팔로워</span>
                <button onclick="closeFollowModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="followListContainer" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
        </div>
    </div>

    <!-- ⚙️ 환경설정 메뉴 모달 -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl relative text-center text-xs divide-y divide-slate-100 dark:divide-slate-800 border border-slate-200 dark:border-slate-800">
            <div class="py-3.5 font-bold text-sm">설정</div>
            
            <div class="p-3.5 flex items-center justify-between px-6">
                <span class="font-semibold flex items-center gap-2"><i class="fa-solid fa-lock text-slate-400"></i> 비공개 계정</span>
                <input type="checkbox" id="privateAccountSwitch" onchange="togglePrivateSetting(this.checked)" class="w-4 h-4 cursor-pointer">
            </div>

            <button onclick="openEditBioModal()" class="w-full py-3.5 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 font-medium">자기소개 수정</button>
            <button onclick="openChangeUsernameModal()" class="w-full py-3.5 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 font-medium">아이디 변경</button>
            <button onclick="openChangePasswordModal()" class="w-full py-3.5 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 font-medium">비밀번호 변경</button>
            <button onclick="openDeleteAccountModal()" class="w-full py-3.5 text-red-500 hover:bg-slate-50 dark:hover:bg-slate-800 font-medium">회원 탈퇴</button>
            <button onclick="logout()" class="w-full py-3.5 text-red-600 font-bold hover:bg-slate-50 dark:hover:bg-slate-800">로그아웃</button>
            <button onclick="closeSettingsModal()" class="w-full py-3.5 text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800">닫기</button>
        </div>
    </div>

    <!-- ✏️ 자기소개(Bio) 수정 모달 -->
    <div id="editBioModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeEditBioModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">자기소개 수정</h3>
            <div class="space-y-3 text-xs">
                <textarea id="bioInput" rows="3" maxlength="30" placeholder="자기소개를 30자 이내로 입력하세요..." class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-transparent text-slate-900 dark:text-white resize-none"></textarea>
                <div class="text-right text-[10px] text-slate-400"><span id="bioCharCount">0</span> / 30자</div>
                <button onclick="submitBioEdit()" class="w-full py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition">저장</button>
            </div>
        </div>
    </div>

    <!-- 🆔 아이디 변경 모달 (30일 제한 안내) -->
    <div id="changeUsernameModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeChangeUsernameModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">아이디 변경</h3>
            <div class="space-y-3 text-xs">
                <p class="text-[11px] text-slate-400 leading-relaxed">아이디는 변경 후 <strong class="text-slate-700 dark:text-slate-200">30일 동안 다시 변경할 수 없습니다.</strong> 신중하게 입력해 주세요.</p>
                <input type="text" id="newUsernameInput" placeholder="새로운 아이디 입력" class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-transparent text-slate-900 dark:text-white">
                <button onclick="submitUsernameChange()" class="w-full py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition">아이디 변경</button>
            </div>
        </div>
    </div>

    <!-- 🔑 비밀번호 변경 모달 -->
    <div id="changePasswordModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeChangePasswordModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">비밀번호 변경</h3>
            <div class="space-y-3 text-xs">
                <input type="password" id="currentPwInput" placeholder="현재 비밀번호" class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-transparent text-slate-900 dark:text-white">
                <input type="password" id="newPwInput" placeholder="새 비밀번호" class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-transparent text-slate-900 dark:text-white">
                <button onclick="submitPasswordChange()" class="w-full py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition">비밀번호 변경</button>
            </div>
        </div>
    </div>

    <!-- ⚠️ 회원 탈퇴 모달 -->
    <div id="deleteAccountModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeDeleteAccountModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4 text-red-500">회원 탈퇴</h3>
            <div class="space-y-3 text-xs">
                <p class="text-[11px] text-slate-500 leading-relaxed">탈퇴 시 모든 게시글, 스토리, 댓글, 팔로우 정보가 영구 삭제되며 복구할 수 없습니다. 계속하려면 비밀번호를 입력하세요.</p>
                <input type="password" id="deleteAccountPwInput" placeholder="비밀번호 확인" class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-transparent text-slate-900 dark:text-white">
                <button onclick="submitDeleteAccount()" class="w-full py-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg transition">계정 영구 삭제</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const pathParts = window.location.pathname.split('/');
        const targetUserFromUrl = pathParts.length > 2 && pathParts[2] ? decodeURIComponent(pathParts[2]) : null;
        let currentProfileUser = null;
        let loggedInUser = null;
        let isMyProfile = false;

        function getDefaultAvatar(sizeClass = "text-base") {
            return `<div class="w-full h-full bg-slate-200 dark:bg-slate-700 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-user ${sizeClass}"></i></div>`;
        }

        function initTheme() {
            const isDark = localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcons(isDark);
        }

        function updateThemeIcons(isDark) {
            const iconPC = document.getElementById('themeIconPC');
            const iconMob = document.getElementById('themeIconMobile');
            const iconClass = isDark ? 'fa-regular fa-sun' : 'fa-regular fa-moon';
            if (iconPC) iconPC.className = iconClass;
            if (iconMob) iconMob.className = iconClass;
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                updateThemeIcons(false);
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                updateThemeIcons(true);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            initProfile();

            const bioInput = document.getElementById('bioInput');
            if (bioInput) {
                bioInput.addEventListener('input', (e) => {
                    document.getElementById('bioCharCount').innerText = e.target.value.length;
                });
            }
        });

        async function initProfile() {
            const meRes = await fetch('/api/me');
            const meData = await meRes.json();
            if (meData.logged_in) loggedInUser = meData.username;

            let targetUser = targetUserFromUrl || (meData.logged_in ? meData.username : null);
            if (!targetUser) { window.location.href = '/'; return; }
            currentProfileUser = targetUser;

            const userRes = await fetch(`/api/users/${encodeURIComponent(targetUser)}`);
            const userData = await userRes.json();
            if (userData.status !== 'success') { alert('사용자를 찾을 수 없습니다.'); window.location.href = '/'; return; }

            const u = userData.user;
            document.getElementById('profileUsername').innerText = `@${u.username}`;
            document.getElementById('followerCount').innerText = u.follower_count;
            document.getElementById('followingCount').innerText = u.following_count;
            document.getElementById('profileBio').innerText = u.bio || '';

            const avatarBox = document.getElementById('profileAvatarBox');
            if (u.profile_img) {
                avatarBox.innerHTML = `<img src="${u.profile_img}" class="w-full h-full object-cover">`;
            } else {
                avatarBox.innerHTML = `<i class="fa-solid fa-user text-3xl sm:text-4xl text-slate-400"></i>`;
            }

            isMyProfile = meData.logged_in && (meData.username === u.username);
            const actionArea = document.getElementById('profileActionArea');
            const avatarOverlay = document.getElementById('avatarEditOverlay');

            if (isMyProfile) {
                document.getElementById('profileEmail').innerText = u.email;
                document.getElementById('tabLikesBtn').classList.remove('hidden');
                document.getElementById('tabBookmarksBtn').classList.remove('hidden');
                document.getElementById('privateAccountSwitch').checked = u.is_private;
                avatarOverlay.classList.remove('hidden');

                actionArea.innerHTML = `
                    <button onclick="openEditBioModal()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-xs rounded-lg transition border border-slate-200 dark:border-slate-700">프로필 편집</button>
                    <button onclick="openSettingsModal()" class="p-2 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-base"><i class="fa-solid fa-gear"></i></button>
                `;
            } else {
                avatarOverlay.classList.add('hidden');
                avatarBox.onclick = null;
                avatarBox.classList.remove('cursor-pointer');

                let btnText = '팔로우';
                let btnClass = 'bg-blue-500 hover:bg-blue-600 text-white';

                if (u.is_following) {
                    btnText = '팔로잉';
                    btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
                } else if (u.is_requested) {
                    btnText = '요청됨';
                    btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700';
                }

                actionArea.innerHTML = `
                    <button onclick="handleFollowToggle('${escapeHtml(u.username)}', this)" class="px-4 py-1.5 font-bold text-xs rounded-lg transition ${btnClass}">${btnText}</button>
                    <a href="/?dm=${encodeURIComponent(u.username)}" class="px-4 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-white font-bold text-xs rounded-lg transition border border-slate-200 dark:border-slate-700">메시지</a>
                `;
            }

            if (!u.can_view_content) {
                document.getElementById('privateLockNotice').classList.remove('hidden');
                document.getElementById('profileTabsArea').classList.add('hidden');
                document.getElementById('myPostsGrid').classList.add('hidden');
            } else {
                document.getElementById('privateLockNotice').classList.add('hidden');
                document.getElementById('profileTabsArea').classList.remove('hidden');
                document.getElementById('myPostsGrid').classList.remove('hidden');
                switchTab('posts');
            }
        }

        // 📷 프로필 사진 업로드 트리거 및 처리
        function triggerProfileImageUpload() {
            if (isMyProfile) {
                document.getElementById('profileImageInput').click();
            }
        }

        async function handleProfileImageFile(input) {
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch('/api/profile-image', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.status === 'success') {
                document.getElementById('profileAvatarBox').innerHTML = `<img src="${data.profile_img}" class="w-full h-full object-cover">`;
            } else {
                alert(data.message || '사진 업로드 실패');
            }
        }

        // 📑 탭 전환 (게시물 / 좋아요 / 저장됨)
        function switchTab(tab) {
            const pBtn = document.getElementById('tabPostsBtn');
            const lBtn = document.getElementById('tabLikesBtn');
            const bBtn = document.getElementById('tabBookmarksBtn');

            pBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";
            lBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";
            bBtn.className = "flex items-center gap-2 py-3 border-t-2 border-transparent text-slate-400 font-semibold text-xs hover:text-slate-600 dark:hover:text-slate-200 tracking-wider";

            if (tab === 'posts') {
                pBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/posts/user/${encodeURIComponent(currentProfileUser)}`).then(r => r.json()).then(d => renderGrid(d.posts));
            } else if (tab === 'likes') {
                lBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/liked-posts`).then(r => r.json()).then(d => renderGrid(d.posts));
            } else if (tab === 'bookmarks') {
                bBtn.className = "flex items-center gap-2 py-3 border-t-2 border-slate-900 dark:border-white font-bold text-xs tracking-wider text-slate-900 dark:text-white";
                fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/bookmarks`).then(r => r.json()).then(d => renderGrid(d.posts));
            }
        }

        function renderGrid(posts) {
            const grid = document.getElementById('myPostsGrid');
            grid.innerHTML = '';
            document.getElementById('postCount').innerText = posts ? posts.length : 0;

            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-center py-16 text-slate-400 text-xs">게시물이 없습니다.</div>';
                return;
            }

            posts.forEach(p => {
                const card = document.createElement('div');
                card.className = "aspect-square bg-slate-100 dark:bg-slate-800 rounded-lg overflow-hidden relative border border-slate-200 dark:border-slate-700 cursor-pointer group";
                card.onclick = () => window.location.href = `/?post=${p.id}`;

                const images = p.image_urls && p.image_urls.length > 0 ? p.image_urls : (p.image_url ? [p.image_url] : []);
                const firstImg = images.length > 0 ? images[0] : '';

                if (p.is_video && firstImg) {
                    card.innerHTML = `
                        <video src="${escapeHtml(firstImg)}" class="w-full h-full object-cover"></video>
                        <i class="fa-solid fa-play absolute top-2 right-2 text-white text-xs drop-shadow"></i>
                    `;
                } else if (firstImg) {
                    card.innerHTML = `<img src="${escapeHtml(firstImg)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`;
                } else {
                    card.innerHTML = `<div class="p-2 text-[10px] text-center flex items-center justify-center h-full break-all">${escapeHtml(p.content)}</div>`;
                }
                grid.appendChild(card);
            });
        }

        // 👥 팔로워 / 팔로잉 목록 모달 열기
        function openFollowModal(type) {
            const modal = document.getElementById('followModal');
            const title = document.getElementById('followModalTitle');
            const list = document.getElementById('followListContainer');

            title.innerText = (type === 'followers') ? '팔로워' : '팔로우';
            list.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs">불러오는 중...</div>';
            modal.classList.remove('hidden');

            fetch(`/api/users/${encodeURIComponent(currentProfileUser)}/${type}`)
                .then(res => res.json())
                .then(data => {
                    list.innerHTML = '';
                    if (data.status === 'success' && data.users.length > 0) {
                        data.users.forEach(u => {
                            const avatarHtml = u.profile_img ? `<img src="${u.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");
                            const row = document.createElement('div');
                            row.className = "flex items-center justify-between p-2 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition";
                            row.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <a href="/profile/${encodeURIComponent(u.username)}" class="w-9 h-9 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700 shrink-0">${avatarHtml}</a>
                                    <div class="truncate">
                                        <a href="/profile/${encodeURIComponent(u.username)}" class="font-bold text-xs text-slate-900 dark:text-white hover:underline block truncate">@${escapeHtml(u.username)}</a>
                                        <span class="text-[10px] text-slate-400 truncate block">${escapeHtml(u.bio || '')}</span>
                                    </div>
                                </div>
                                <a href="/profile/${encodeURIComponent(u.username)}" class="px-3 py-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-lg hover:bg-slate-200 transition">보기</a>
                            `;
                            list.appendChild(row);
                        });
                    } else {
                        list.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">목록이 비어 있습니다.</div>`;
                    }
                });
        }

        function closeFollowModal() { document.getElementById('followModal').classList.add('hidden'); }

        function handleFollowToggle(target, btn) {
            if (!loggedInUser) { window.location.href = '/'; return; }
            fetch(`/api/follow/${encodeURIComponent(target)}`, { method: 'POST' })
                .then(res => res.json())
                .then(d => {
                    if (d.result_status === 'following') {
                        btn.innerText = '팔로잉';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
                    } else if (d.result_status === 'requested') {
                        btn.innerText = '요청됨';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700';
                    } else {
                        btn.innerText = '팔로우';
                        btn.className = 'px-4 py-1.5 font-bold text-xs rounded-lg transition bg-blue-500 hover:bg-blue-600 text-white';
                    }
                    document.getElementById('followerCount').innerText = d.follower_count;
                });
        }

        function togglePrivateSetting(isPrivate) {
            fetch('/api/profile-privacy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_private: isPrivate })
            });
        }

        // ⚙️ 모달 제어 함수들
        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        function openEditBioModal() {
            closeSettingsModal();
            const currentBio = document.getElementById('profileBio').innerText;
            document.getElementById('bioInput').value = currentBio;
            document.getElementById('bioCharCount').innerText = currentBio.length;
            document.getElementById('editBioModal').classList.remove('hidden');
        }
        function closeEditBioModal() { document.getElementById('editBioModal').classList.add('hidden'); }

        function submitBioEdit() {
            const bio = document.getElementById('bioInput').value.trim();
            fetch('/api/profile-bio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bio })
            }).then(r => r.json()).then(d => {
                if (d.status === 'success') {
                    document.getElementById('profileBio').innerText = d.bio;
                    closeEditBioModal();
                } else alert(d.message);
            });
        }

        function openChangeUsernameModal() { closeSettingsModal(); document.getElementById('changeUsernameModal').classList.remove('hidden'); }
        function closeChangeUsernameModal() { document.getElementById('changeUsernameModal').classList.add('hidden'); }

        function submitUsernameChange() {
            const newUsername = document.getElementById('newUsernameInput').value.trim();
            if (!newUsername) { alert('새 아이디를 입력해 주세요.'); return; }
            fetch('/api/change-username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ new_username: newUsername })
            }).then(r => r.json()).then(d => {
                if (d.status === 'success') {
                    alert('아이디가 변경되었습니다!');
                    window.location.href = `/profile/${encodeURIComponent(d.new_username)}`;
                } else alert(d.message);
            });
        }

        function openChangePasswordModal() { closeSettingsModal(); document.getElementById('changePasswordModal').classList.remove('hidden'); }
        function closeChangePasswordModal() { document.getElementById('changePasswordModal').classList.add('hidden'); }

        function submitPasswordChange() {
            const current_password = document.getElementById('currentPwInput').value.trim();
            const new_password = document.getElementById('newPwInput').value.trim();
            fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ current_password, new_password })
            }).then(r => r.json()).then(d => {
                if (d.status === 'success') {
                    alert('비밀번호가 성공적으로 변경되었습니다.');
                    closeChangePasswordModal();
                } else alert(d.message);
            });
        }

        function openDeleteAccountModal() { closeSettingsModal(); document.getElementById('deleteAccountModal').classList.remove('hidden'); }
        function closeDeleteAccountModal() { document.getElementById('deleteAccountModal').classList.add('hidden'); }

        function submitDeleteAccount() {
            const password = document.getElementById('deleteAccountPwInput').value.trim();
            if (!password) { alert('비밀번호를 입력해 주세요.'); return; }
            if (!confirm('정말로 탈퇴하시겠습니까? 데이터는 복구되지 않습니다.')) return;
            fetch('/api/delete-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            }).then(r => r.json()).then(d => {
                if (d.status === 'success') {
                    alert('회원 탈퇴가 완료되었습니다.');
                    window.location.href = '/';
                } else alert(d.message);
            });
        }

        function logout() { fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/'); }
        function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woongstagram</title>
    
    <!-- 🛠️ PWA 설정 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/static/img/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- ✂️ Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .story-viewed { background: #cbd5e1 !important; }
        .dark .story-viewed { background: #475569 !important; }
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
        .animate-progress { animation: progress 5s linear forwards; }
        body { -webkit-text-size-adjust: none; touch-action: manipulation; overflow-x: hidden; }
        .pwa-install-banner { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white transition-colors duration-200" onclick="handleOutsideClicks(event)">

    <!-- Header Navigation (모바일 최적화 완벽 적용) -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-40 w-full transition-colors">
        <div class="max-w-5xl mx-auto px-2 sm:px-4 h-14 flex items-center justify-between gap-1 sm:gap-4">
            <!-- 로고 (크기 축소 및 간격 조정) -->
            <div onclick="location.reload()" class="text-lg sm:text-2xl font-black tracking-tight italic cursor-pointer font-serif text-slate-900 dark:text-white select-none shrink-0 ml-1 sm:ml-0">
                Woongstagram
            </div>

            <!-- 🔍 검색창 (모바일 반응형 자동 조절 및 최소 너비 확보) -->
            <div class="relative flex-1 min-w-[80px] sm:max-w-xs mx-auto">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" placeholder="검색" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg pl-6 pr-1.5 py-1 text-[11px] outline-none focus:bg-white dark:focus:bg-slate-900 focus:border-slate-400 transition text-slate-900 dark:text-slate-100 placeholder:text-slate-400">
                    <i class="fa-solid fa-magnifying-glass absolute left-2 top-2.5 text-slate-400 text-[9px] sm:text-xs"></i>
                </div>

                <div id="searchResultsDropdown" class="hidden absolute top-10 -left-16 sm:left-0 w-64 sm:w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl max-h-80 overflow-y-auto p-2 text-xs z-50 divide-y divide-slate-100 dark:divide-slate-800">
                    <div id="searchUserResults"></div>
                    <div id="searchPostResults"></div>
                </div>
            </div>

            <!-- 상단 액션 아이콘들 (간격 최소화 및 정렬) -->
            <div class="flex items-center gap-1.5 sm:gap-4 text-sm sm:text-lg text-slate-800 dark:text-slate-200 shrink-0 mr-1 sm:mr-0">
                <!-- 🌓 다크모드 토글 버튼 -->
                <button onclick="toggleDarkMode()" class="p-1 hover:text-amber-500 transition" title="테마 변경">
                    <i id="themeIcon" class="fa-regular fa-moon"></i>
                </button>

                <!-- 🎬 릴스 버튼 -->
                <button onclick="openReelsModal()" class="p-1 hover:text-pink-500 transition" title="릴스 보기">
                    <i class="fa-solid fa-clapperboard"></i>
                </button>

                <!-- 💬 DM 버튼 (JavaScript 연동) -->
                <button onclick="openDmModal()" class="relative p-1 hover:text-blue-500 transition" title="다이렉트 메시지">
                    <i class="fa-regular fa-paper-plane"></i>
                    <span id="dmBadge" class="hidden absolute -top-1 -right-1 bg-blue-500 text-white text-[8px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">0</span>
                </button>

                <i onclick="openCreatePostModal()" class="fa-square-plus fa-regular cursor-pointer hover:text-slate-500 transition p-1" title="새 게시물"></i>
                
                <!-- 🔔 알림 버튼 -->
                <div class="relative">
                    <button onclick="toggleNotificationDropdown(event)" class="relative p-1 hover:text-slate-500 transition flex items-center" title="알림">
                        <i class="fa-regular fa-heart"></i>
                        <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">0</span>
                    </button>

                    <div id="notifDropdown" class="hidden absolute top-10 right-0 w-72 sm:w-80 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-h-96 overflow-y-auto p-3 text-xs z-50 divide-y divide-slate-100 dark:divide-slate-800">
                        <div class="font-bold text-slate-900 dark:text-white pb-2 mb-1 flex justify-between items-center text-xs">
                            <span>알림</span>
                            <span id="unreadNotifText" class="text-[10px] text-blue-500 font-normal"></span>
                        </div>
                        <div id="followRequestsSection" class="hidden pb-2 mb-2 border-b border-slate-100 dark:border-slate-800">
                            <span class="text-[10px] font-bold text-slate-400">팔로우 요청</span>
                            <div id="followRequestsList" class="space-y-2 mt-1"></div>
                        </div>
                        <div id="notifList" class="space-y-2 pt-1"></div>
                    </div>
                </div>

                <a href="/admin" id="headerAdminBtn" class="hidden text-red-500 hover:text-red-700 transition p-1" title="관리자">
                    <i class="fa-solid fa-key"></i>
                </a>
                <a href="/profile" id="headerProfileBtn" class="hidden hover:text-slate-500 transition p-1" title="프로필">
                    <i class="fa-regular fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 sm:py-6 w-full flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8 pb-12">
        
        <!-- Feed Column (2 Cols) -->
        <section class="md:col-span-2 space-y-4 sm:space-y-6">
            
            <!-- Story Bar -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 sm:p-4 flex items-center gap-3 sm:gap-4 overflow-x-auto scrollbar-hide shadow-sm select-none">
                <div onclick="openCreateStoryModal()" class="flex flex-col items-center gap-1 min-w-[56px] sm:min-w-[64px] cursor-pointer group shrink-0">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-500 group-hover:border-blue-500 group-hover:text-blue-500 transition">
                        <i class="fa-solid fa-plus text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[10px] sm:text-[11px] font-semibold text-slate-600 dark:text-slate-400 truncate w-12 sm:w-14 text-center">내 스토리</span>
                </div>

                <div id="storiesContainer" class="flex items-center gap-3 sm:gap-4"></div>
            </div>

            <!-- Feed Posts -->
            <div id="postFeedContainer" class="space-y-4 sm:space-y-6"></div>
        </section>

        <!-- Sidebar Column -->
        <aside class="hidden md:block space-y-6">
            <div id="profileCard" class="bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm"></div>
            
            <div id="recommendationCard" class="bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm">
                <div class="flex items-center justify-between text-xs font-bold text-slate-900 dark:text-white mb-3">
                    <span>회원님을 위한 맞춤 추천</span>
                    <i class="fa-solid fa-sparkles text-amber-500"></i>
                </div>
                <div id="recommendationList" class="space-y-3 text-xs"></div>
            </div>

            <div class="bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm">
                <div class="flex items-center justify-between text-xs font-bold text-slate-900 dark:text-white mb-3">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-newspaper text-blue-500"></i> 오늘의 주요 뉴스</span>
                    <span class="text-[10px] text-slate-400 font-normal">1시간마다 갱신</span>
                </div>
                <div id="newsList" class="space-y-2.5 text-xs"></div>
            </div>

            <footer class="text-[11px] text-slate-400 leading-relaxed font-sans px-1">
                소개 • 도움말 • 개인정보처리방침 • 약관
                <p class="mt-3 text-slate-500">© 2026 WOONGSTAGRAM WEB APP</p>
            </footer>
        </aside>

    </main>

    <!-- 🛠️ PWA 설치 유도 배너, iOS 전용 설치 안내 모달, 로그인 모달, 게시물 작성 모달 등은 이전과 동일하므로 생략합니다. -->
    <!-- 💬 1:1 DM 모달 -->
    <div id="dmModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-xl h-[600px] rounded-2xl overflow-hidden shadow-2xl relative flex flex-col sm:flex-row border border-slate-200 dark:border-slate-800">
            <button onclick="closeDmModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- 대화 목록 (좌측) -->
            <div id="dmConversationsList" class="w-full sm:w-1/3 border-r border-slate-200 dark:border-slate-800 p-3 overflow-y-auto space-y-2">
                <h3 class="font-bold text-xs text-slate-900 dark:text-white mb-2">메시지</h3>
                <div id="dmConvContainer" class="space-y-1"></div>
            </div>

            <!-- 대화창 (우측) -->
            <div id="dmChatArea" class="flex-1 flex flex-col justify-between bg-slate-50 dark:bg-slate-950 p-3">
                <div class="border-b border-slate-200 dark:border-slate-800 pb-2 mb-2 font-bold text-xs flex items-center gap-2">
                    <span id="dmChatPartner" class="text-slate-800 dark:text-slate-100">대화 상대를 선택하세요</span>
                </div>
                <div id="dmMessagesContainer" class="flex-1 overflow-y-auto space-y-2 p-1 text-xs"></div>
                <div class="flex items-center gap-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                    <input type="text" id="dmMessageInput" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendDmMessage()" class="flex-1 px-3 py-2 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none text-slate-900 dark:text-white">
                    <button onclick="sendDmMessage()" class="px-3 py-2 bg-blue-500 text-white font-bold text-xs rounded-lg hover:bg-blue-600">전송</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🎬 릴스 전체 화면 모달 -->
    <div id="reelsModal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center">
        <button onclick="closeReelsModal()" class="absolute top-5 right-5 text-white text-2xl hover:text-slate-400 z-50">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div id="reelsContainer" class="w-full max-w-sm h-[85vh] bg-slate-900 rounded-2xl overflow-hidden relative shadow-2xl border border-slate-800 flex items-center justify-center">
            <!-- 릴스 비디오 삽입 영역 -->
        </div>
    </div>

    <!-- 🛠️ JavaScript 로직 (DM 기능 및 다크모드 포함) -->
    <script>
        let currentUser = null;
        let isAdminUser = false;
        let currentAuthView = 'login';
        let storyTimer = null;
        let activeDmPartner = null;
        let searchTimer = null;
        let deferredPrompt = null;

        let cropperInstance = null;
        let currentCropMode = null;
        let pendingFiles = [];
        let currentFileIndex = 0;
        let postCroppedBlobs = [];
        let storyCroppedBlob = null;

        function getDefaultAvatar(sizeClass = "text-base") {
            return `<div class="w-full h-full bg-slate-200 dark:bg-slate-700 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-user ${sizeClass}"></i></div>`;
        }

        // 🌓 다크모드 초기화 및 토글
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-regular fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-regular fa-moon';
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('themeIcon').className = 'fa-regular fa-moon';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('themeIcon').className = 'fa-regular fa-sun';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            checkLoginStatus();
            loadStories();
            loadPosts();
            loadHotNews();
            setInterval(loadNotifications, 10000);

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(() => console.log('Service Worker Registered'))
                    .catch((err) => console.log('SW Registration Failed', err));
            }
        });

        // 텍스트 내 해시태그 및 멘션 파싱 (@username -> 링크, #tag -> 태그검색)
        function formatFormattedText(text) {
            if (!text) return '';
            let formatted = escapeHtml(text);
            formatted = formatted.replace(/#([a-zA-Z0-9ㄱ-ㅎ가-힣_]+)/g, '<span onclick="filterByTag(\'$1\')" class="text-blue-500 font-semibold cursor-pointer hover:underline">#$1</span>');
            formatted = formatted.replace(/@([a-zA-Z0-9_]+)/g, '<a href="/profile/$1" class="text-blue-500 font-semibold hover:underline">@$1</a>');
            return formatted;
        }

        function filterByTag(tag) {
            fetch(`/api/posts/tag/${tag}`)
                .then(res => res.json())
                .then(data => {
                    const feed = document.getElementById('postFeedContainer');
                    feed.innerHTML = `<div class="p-3 bg-blue-50 dark:bg-slate-800 rounded-xl text-xs font-bold text-blue-600 flex justify-between items-center">
                        <span>#${tag} 태그 검색 결과 (${data.posts.length}개)</span>
                        <button onclick="loadPosts()" class="text-slate-500 hover:text-slate-800">전체 보기</button>
                    </div>`;
                    renderPostsToContainer(data.posts, feed);
                });
        }

        function checkLoginStatus() {
            fetch('/api/me')
                .then(res => res.json())
                .then(data => {
                    const card = document.getElementById('profileCard');
                    const headerBtn = document.getElementById('headerProfileBtn');
                    const adminBtn = document.getElementById('headerAdminBtn');
                    const recoCard = document.getElementById('recommendationCard');

                    if (data.logged_in) {
                        currentUser = data.username;
                        isAdminUser = data.is_admin;
                        headerBtn.classList.remove('hidden');
                        if (isAdminUser) adminBtn.classList.remove('hidden');
                        loadNotifications();
                        loadFollowRequests();
                        loadDmConversations(); // 로그인 상태일 때 DM 대화 목록 불러오기

                        if (!isAdminUser) {
                            recoCard.classList.remove('hidden');
                            loadRecommendations();
                        } else {
                            recoCard.classList.add('hidden');
                        }
                        
                        const avatar = data.profile_img ? `<img src="${data.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-sm");
                        card.innerHTML = `
                            <div class="flex items-center justify-between text-xs">
                                <div class="flex items-center gap-3">
                                    <a href="/profile/${currentUser}" class="w-10 h-10 rounded-full border border-slate-200 dark:border-slate-700 flex items-center justify-center overflow-hidden shrink-0">${avatar}</a>
                                    <a href="/profile/${currentUser}" class="font-bold hover:underline">@${escapeHtml(currentUser)}</a>
                                </div>
                                <a href="/profile/${currentUser}" class="text-blue-500 font-semibold text-[11px] hover:underline">프로필</a>
                            </div>
                        `;
                    } else {
                        currentUser = null;
                        headerBtn.classList.add('hidden');
                        card.innerHTML = `
                            <p class="text-xs text-slate-500 mb-3 leading-relaxed">로그인하여 Woongstagram의 사진을 공유하고 소통해 보세요.</p>
                            <button onclick="openAuthModal()" class="w-full py-2 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded-lg transition shadow-sm">로그인 / 회원가입</button>
                        `;
                        recoCard.classList.remove('hidden');
                        loadRecommendations();
                    }
                });
        }

        function loadHotNews() {
            fetch('/api/news')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('newsList');
                    list.innerHTML = '';
                    if (data.status === 'success' && data.articles.length > 0) {
                        data.articles.forEach(art => {
                            const item = document.createElement('div');
                            item.className = "border-b border-slate-100 dark:border-slate-800 pb-2 last:border-0";
                            item.innerHTML = `<a href="${art.link}" target="_blank" class="font-semibold text-slate-800 dark:text-slate-300 hover:text-blue-600 transition line-clamp-1 block">${escapeHtml(art.title)}</a>`;
                            list.appendChild(item);
                        });
                    } else {
                        list.innerHTML = `<div class="text-slate-400 text-[11px]">뉴스를 불러오는 중입니다...</div>`;
                    }
                });
        }

        function loadRecommendations() {
            fetch('/api/recommendations')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('recommendationList');
                    list.innerHTML = '';
                    if (data.status === 'success' && data.recommendations.length > 0) {
                        data.recommendations.forEach(r => {
                            const avatar = r.profile_img ? `<img src="${r.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");
                            const item = document.createElement('div');
                            item.className = "flex items-center justify-between";
                            item.innerHTML = `
                                <div class="flex items-center gap-2.5">
                                    <a href="/profile/${r.username}" class="w-8 h-8 rounded-full border border-slate-200 dark:border-slate-700 flex items-center justify-center overflow-hidden shrink-0">${avatar}</a>
                                    <div class="flex flex-col">
                                        <a href="/profile/${r.username}" class="font-semibold text-slate-800 dark:text-slate-200 hover:underline">@${escapeHtml(r.username)}</a>
                                        <span class="text-[10px] text-slate-400">${escapeHtml(r.reason)}</span>
                                    </div>
                                </div>
                                <button onclick="followUser('${r.username}', this)" class="text-blue-500 font-semibold text-[11px] hover:text-blue-700">팔로우</button>
                            `;
                            list.appendChild(item);
                        });
                    }
                });
        }

        function followUser(targetUsername, btn) {
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            fetch(`/api/follow/${targetUsername}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        btn.innerText = data.is_following ? '팔로잉' : '팔로우';
                        btn.className = data.is_following ? "text-slate-500 font-semibold text-[11px]" : "text-blue-500 font-semibold text-[11px] hover:text-blue-700";
                    } else alert(data.message);
                });
        }

        function loadStories() {
            fetch('/api/stories').then(res => res.json()).then(data => {
                const c = document.getElementById('storiesContainer');
                c.innerHTML = '';
                if (data.status === 'success') {
                    data.stories.forEach(s => {
                        const avatar = s.profile_img ? `<img src="${s.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");
                        const item = document.createElement('div');
                        item.className = "flex flex-col items-center gap-1 min-w-[56px] sm:min-w-[64px] cursor-pointer group shrink-0";
                        item.onclick = () => showStoryModal(item, s.id, s.username, s.desc, s.image_url, s.created_at, s.profile_img);
                        
                        const ringClass = s.is_viewed ? 'story-viewed' : 'story-ring';
                        item.innerHTML = `
                            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full p-[2px] ${ringClass} transition group-hover:scale-105">
                                <div class="w-full h-full rounded-full bg-white dark:bg-slate-900 flex items-center justify-center border-2 border-white dark:border-slate-900 overflow-hidden text-[10px]">@${s.username[0]}</div>
                            </div>
                            <span class="text-[10px] sm:text-[11px] text-slate-600 dark:text-slate-400 truncate w-12 sm:w-14 text-center">@${s.username}</span>
                        `;
                        c.appendChild(item);
                    });
                }
            });
        }

        // 스토리는 이전과 동일하므로 생략합니다.

        function loadPosts() {
            fetch('/api/posts')
                .then(res => res.json())
                .then(data => {
                    const feed = document.getElementById('postFeedContainer');
                    feed.innerHTML = '';
                    renderPostsToContainer(data.posts, feed);
                });
        }

        function renderPostsToContainer(posts, container) {
            if (!posts || posts.length === 0) {
                container.innerHTML += `<div class="text-center py-12 text-xs text-slate-400">게시글이 없습니다.</div>`;
                return;
            }

            posts.forEach(post => {
                const article = document.createElement('article');
                article.className = "border border-slate-200 dark:border-slate-800 rounded-xl bg-white dark:bg-slate-900 overflow-hidden shadow-sm";
                
                const images = post.image_urls && post.image_urls.length > 0 ? post.image_urls : (post.image_url ? [post.image_url] : []);
                let mediaHtml = '';

                if (post.is_video && images.length > 0) {
                    mediaHtml = `<video src="${escapeHtml(images[0])}" controls playsinline class="w-full max-h-[450px] bg-black"></video>`;
                } else if (images.length > 0) {
                    mediaHtml = `<img src="${escapeHtml(images[0])}" class="w-full max-h-[450px] object-cover border-y border-slate-100 dark:border-slate-800">`;
                }

                const avatar = post.profile_img ? `<img src="${post.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");

                article.innerHTML = `
                    <div class="p-3 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
                        <div class="flex items-center gap-2.5">
                            <a href="/profile/${post.username}" class="w-8 h-8 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700 shrink-0">${avatar}</a>
                            <a href="/profile/${post.username}" class="text-xs font-semibold hover:underline">@${escapeHtml(post.username)}</a>
                        </div>
                    </div>
                    ${mediaHtml}
                    <div class="p-3 text-xs">
                        <div class="flex items-center justify-between text-xl mb-2.5 text-slate-800 dark:text-slate-200">
                            <div class="flex items-center gap-4">
                                <i onclick="toggleLike(${post.id})" id="likeIcon-${post.id}" class="${post.is_liked ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart'} cursor-pointer"></i>
                                <i onclick="focusComment(${post.id})" class="fa-regular fa-comment cursor-pointer"></i>
                            </div>
                            <i onclick="toggleBookmark(${post.id}, this)" class="${post.is_bookmarked ? 'fa-solid fa-bookmark text-slate-900 dark:text-white' : 'fa-regular fa-bookmark'} cursor-pointer hover:text-blue-500" title="저장하기"></i>
                        </div>
                        <p class="font-semibold mb-1" id="likeCount-${post.id}">좋아요 ${post.likes}개</p>
                        <p class="leading-relaxed mb-3">
                            <a href="/profile/${post.username}" class="font-semibold mr-1.5 hover:underline">@${escapeHtml(post.username)}</a>
                            ${formatFormattedText(post.content)}
                        </p>
                        <div id="commentList-${post.id}" class="space-y-1 text-[11px] mb-3"></div>
                        <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                            <input type="text" id="commentInput-${post.id}" placeholder="댓글 달기..." onkeypress="if(event.key==='Enter') addComment(${post.id})" class="w-full text-xs outline-none bg-transparent placeholder-slate-400">
                            <button onclick="addComment(${post.id})" class="text-blue-500 font-semibold text-xs ml-2 hover:text-blue-700">게시</button>
                        </div>
                    </div>
                `;
                container.appendChild(article);
                loadComments(post.id);
            });
        }

        // 🎬 릴스 모달 제어
        function openReelsModal() {
            fetch('/api/reels')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('reelsContainer');
                    container.innerHTML = '';
                    if (data.status === 'success' && data.reels.length > 0) {
                        const reel = data.reels[0];
                        container.innerHTML = `
                            <video src="${reel.video_url}" autoplay loop playsinline class="w-full h-full object-cover"></video>
                            <div class="absolute bottom-4 left-4 right-4 text-white text-xs drop-shadow z-10">
                                <p class="font-bold mb-1">@${escapeHtml(reel.username)}</p>
                                <p>${formatFormattedText(reel.content)}</p>
                            </div>
                        `;
                        document.getElementById('reelsModal').classList.remove('hidden');
                    } else {
                        alert('등록된 릴스 동영상이 없습니다.');
                    }
                });
        }
        function closeReelsModal() { document.getElementById('reelsModal').classList.add('hidden'); }

        // 💬 DM 모달 제어 (JavaScript 로직 보강)
        function openDmModal(partner = null) {
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            document.getElementById('dmModal').classList.remove('hidden');
            loadDmConversations();
            if (partner) {
                activeDmPartner = partner; // 활성화된 대화 상대 설정
                loadDmMessages(partner);
            }
        }
        function closeDmModal() {
            document.getElementById('dmModal').classList.add('hidden');
            activeDmPartner = null; // 대화 상대 초기화
            document.getElementById('dmChatPartner').innerText = "대화 상대를 선택하세요";
            document.getElementById('dmMessagesContainer').innerHTML = "";
        }

        function loadDmConversations() {
            fetch('/api/dm/conversations')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('dmConvContainer');
                    container.innerHTML = '';
                    if (data.conversations.length === 0) {
                        container.innerHTML = '<p class="text-slate-400 text-[11px] py-4 text-center">대화 내역이 없습니다.</p>';
                        return;
                    }
                    data.conversations.forEach(c => {
                        const avatar = c.profile_img ? `<img src="${c.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-[9px]");
                        const item = document.createElement('div');
                        item.className = "p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer flex items-center justify-between gap-2";
                        item.onclick = () => loadDmMessages(c.partner);
                        item.innerHTML = `
                            <div class="flex items-center gap-2 truncate">
                                <div class="w-7 h-7 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700 shrink-0">${avatar}</div>
                                <div class="truncate">
                                    <p class="font-bold text-xs text-slate-900 dark:text-white">@${escapeHtml(c.partner)}</p>
                                    <p class="text-[10px] text-slate-400 truncate">${escapeHtml(c.last_message)}</p>
                                </div>
                            </div>
                            ${c.unread_count > 0 ? `<span class="bg-blue-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold">${c.unread_count}</span>` : ''}
                        `;
                        container.appendChild(item);
                    });
                });
        }

        function loadDmMessages(partner) {
            activeDmPartner = partner;
            document.getElementById('dmChatPartner').innerText = `@${partner} 님과의 대화`;
            fetch(`/api/dm/${partner}`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('dmMessagesContainer');
                    container.innerHTML = '';
                    data.messages.forEach(m => {
                        const isMe = m.sender === currentUser;
                        const msgDiv = document.createElement('div');
                        msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                        msgDiv.innerHTML = `
                            <div class="max-w-[70%] px-3 py-1.5 rounded-2xl ${isMe ? 'bg-blue-500 text-white rounded-br-none' : 'bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white rounded-bl-none'}">
                                <p>${escapeHtml(m.message)}</p>
                                <span class="text-[8px] opacity-70 block text-right mt-0.5">${m.created_at}</span>
                            </div>
                        `;
                        container.appendChild(msgDiv);
                    });
                    container.scrollTop = container.scrollHeight;
                    loadDmConversations(); // 메시지를 불러온 후 대화 목록 업데이트 (읽음 처리 반영)
                });
        }

        function sendDmMessage() {
            if (!activeDmPartner) { alert('대화 상대를 먼저 선택하세요.'); return; }
            const input = document.getElementById('dmMessageInput');
            const msg = input.value.trim();
            if (!msg) return;

            fetch(`/api/dm/${activeDmPartner}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            }).then(() => {
                input.value = '';
                loadDmMessages(activeDmPartner);
            });
        }

        // 팔로우 요청, 북마크 토글 등 이전과 동일하므로 생략합니다.

        // 공통 기본 함수들
        function toggleLike(postId) {
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            fetch(`/api/posts/${postId}/like`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById(`likeIcon-${postId}`).className = data.is_liked ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart';
                        document.getElementById(`likeCount-${postId}`).innerText = `좋아요 ${data.likes}개`;
                    }
                });
        }

        function loadComments(postId) {
            fetch(`/api/comments/${postId}`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById(`commentList-${postId}`);
                    list.innerHTML = '';
                    data.comments.forEach(c => {
                        const p = document.createElement('p');
                        p.innerHTML = `<a href="/profile/${c.username}" class="font-semibold mr-1">@${escapeHtml(c.username)}</a> ${formatFormattedText(c.content)}`;
                        list.appendChild(p);
                    });
                });
        }

        function addComment(postId) {
            if (!currentUser) { openAuthModal(); return; }
            const input = document.getElementById(`commentInput-${postId}`);
            if (!input.value.trim()) return;
            fetch('/api/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id: postId, content: input.value.trim() })
            }).then(() => { input.value = ''; loadComments(postId); });
        }

        function focusComment(id) { document.getElementById(`commentInput-${id}`).focus(); }

        function handleOutsideClicks(e) {
            const notif = document.getElementById('notifDropdown');
            if (notif && !notif.contains(e.target)) notif.classList.add('hidden');
            const search = document.getElementById('searchResultsDropdown');
            if (search && !search.contains(e.target)) search.classList.add('hidden');
        }

        function handleSearchInput(v) {
            clearTimeout(searchTimer);
            if (!v.trim()) { document.getElementById('searchResultsDropdown').classList.add('hidden'); return; }
            searchTimer = setTimeout(() => {
                fetch(`/api/search?q=${encodeURIComponent(v.trim())}`)
                    .then(res => res.json())
                    .then(data => {
                        const drop = document.getElementById('searchResultsDropdown');
                        const uBox = document.getElementById('searchUserResults');
                        const pBox = document.getElementById('searchPostResults');
                        uBox.innerHTML = ''; pBox.innerHTML = '';

                        data.users.forEach(u => {
                            const a = document.createElement('a');
                            a.href = `/profile/${u.username}`;
                            a.className = "block p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 font-bold";
                            a.innerText = `@${u.username}`;
                            uBox.appendChild(a);
                        });
                        drop.classList.remove('hidden');
                    });
            }, 250);
        }

        function escapeHtml(t) { return t ? t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>

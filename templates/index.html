        function getDefaultAvatar(sizeClass = "text-base") {
            return `<div class="w-full h-full bg-slate-200 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-user ${sizeClass}"></i></div>`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkLoginStatus();
            loadStories();
            loadPosts();
            loadHotNews();
            setInterval(loadNotifications, 10000); // 10초 주기 알림 갱신

            // 🛠️ [신규 PWA 설정] PWA 서비스 워커 등록
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(() => console.log('Service Worker Registered'))
                    .catch((err) => console.log('SW Registration Failed', err));
            }
        });

        // 🛠️ [신규 PWA 설정] 크롬/안드로이드용 PWA 설치 팝업 캡처 및 유도
        window.addEventListener('beforeinstallprompt', (e) => {
            // 브라우저 기본 설치 창 방지
            e.preventDefault();
            // 설치 이벤트 저장
            deferredPrompt = e;
            // 로컬 스토리지에 '닫기' 기록이 없을 때만 배너 표시
            if (!localStorage.getItem('pwa_install_closed')) {
                document.getElementById('pwaInstallBanner').classList.remove('hidden');
            }
        });

        // 🛠️ [신규 PWA 설정] PWA 앱 설치 실행 함수 (갤럭시/크롬 등)
        function installPwaApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the PWA install prompt');
                        closePwaBanner();
                    }
                    deferredPrompt = null;
                });
            } else {
                // beforeinstallprompt가 아직 실행 안 됐을 때 (iOS 등)
                // iOS 체크 로직 필요
                const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIos) {
                    closePwaBanner();
                    document.getElementById('iosInstallModal').classList.remove('hidden');
                } else {
                    alert('브라우저 메뉴에서 [설치] 또는 [홈 화면에 추가]를 눌러주세요.');
                }
            }
        }

        // 🛠️ [신규 PWA 설정] PWA 배너 닫기 및 24시간 기록 (로컬 스토리지)
        function closePwaBanner() {
            document.getElementById('pwaInstallBanner').classList.add('hidden');
            localStorage.setItem('pwa_install_closed', 'true');
            // 24시간 후 기록 삭제 로직 (필요시 추가)
        }

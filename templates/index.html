<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Woongstagram</title>
    
    <!-- 🛠️ PWA 설정 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/static/img/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- ✂️ Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .story-viewed { background: #cbd5e1 !important; }
        .dark .story-viewed { background: #475569 !important; }
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
        .animate-progress { animation: progress 5s linear forwards; }
        body { -webkit-text-size-adjust: none; touch-action: manipulation; }
        /* 스크롤바 숨김 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white transition-colors duration-200 pb-16 md:pb-0" onclick="handleOutsideClicks(event)">

    <!-- 🔝 상단 헤더 -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-40 w-full transition-colors">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between gap-4 relative">
            <div onclick="location.href='/'" class="text-xl sm:text-2xl font-black italic cursor-pointer font-serif text-slate-900 dark:text-white select-none shrink-0">
                Woongstagram
            </div>

            <!-- 🔍 실시간 검색창 -->
            <div class="relative flex-1 max-w-[180px] sm:max-w-xs mx-auto" onclick="event.stopPropagation()">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" placeholder="검색" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs outline-none focus:bg-white dark:focus:bg-slate-900 focus:border-slate-400 transition text-slate-900 dark:text-slate-100 placeholder:text-slate-400">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                </div>
                <div id="searchResultsDropdown" class="hidden absolute top-10 left-0 w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-2xl max-h-80 overflow-y-auto p-2 text-xs z-50 divide-y divide-slate-100 dark:divide-slate-800">
                    <div id="searchUserResults"></div>
                    <div id="searchPostResults"></div>
                </div>
            </div>

            <!-- 상단 우측 아이콘 (모바일에서는 하트, DM만 표시 / 웹에서는 전부 표시) -->
            <div class="flex items-center gap-4 sm:gap-5 text-lg text-slate-800 dark:text-slate-200 shrink-0">
                <button onclick="openCreatePostModal()" class="hidden md:inline-block hover:text-blue-500 transition" title="새 게시물 만들기">
                    <i class="fa-regular fa-square-plus"></i>
                </button>
                <button onclick="openReelsModal()" class="hidden md:inline-block hover:text-pink-500 transition" title="릴스 동영상 보기">
                    <i class="fa-solid fa-clapperboard"></i>
                </button>
                <div class="relative">
                    <button onclick="toggleNotificationDropdown(event)" class="relative hover:text-slate-500 transition flex items-center" title="알림">
                        <i class="fa-regular fa-heart"></i>
                        <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">0</span>
                    </button>
                    <div id="notifDropdown" class="hidden absolute top-10 right-0 w-72 sm:w-80 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-h-96 overflow-y-auto p-3 text-xs z-50 divide-y divide-slate-100 dark:divide-slate-800" onclick="event.stopPropagation()">
                        <div class="font-bold text-slate-900 dark:text-white pb-2 mb-1 flex justify-between items-center text-xs">
                            <span>알림</span>
                            <span id="unreadNotifText" class="text-[10px] text-blue-500 font-normal"></span>
                        </div>
                        <div id="followRequestsSection" class="hidden pb-2 mb-2 border-b border-slate-100 dark:border-slate-800">
                            <span class="text-[10px] font-bold text-slate-400">팔로우 요청</span>
                            <div id="followRequestsList" class="space-y-2 mt-1"></div>
                        </div>
                        <div id="notifList" class="space-y-2 pt-1"></div>
                    </div>
                </div>
                <button onclick="openDmModal()" class="relative hover:text-blue-500 transition" title="메시지">
                    <i class="fa-regular fa-paper-plane"></i>
                    <span id="dmBadge" class="hidden absolute -top-1 -right-1 bg-blue-500 text-white text-[8px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">0</span>
                </button>
                <a href="/admin" id="headerAdminBtn" class="hidden text-slate-600 dark:text-slate-300 hover:text-red-500 transition" title="관리자 페이지">
                    <i class="fa-solid fa-key"></i>
                </a>
                <a href="/profile" class="hidden md:inline-block hover:text-slate-500 transition" title="프로필">
                    <i class="fa-regular fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-4 sm:py-6 w-full flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8">
        <section class="md:col-span-2 space-y-4 sm:space-y-6">
            <!-- 스토리 바 -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 sm:p-4 flex items-center gap-3 sm:gap-4 overflow-x-auto scrollbar-hide shadow-sm select-none">
                <div onclick="openCreateStoryModal()" class="flex flex-col items-center gap-1 min-w-[56px] sm:min-w-[64px] cursor-pointer group shrink-0">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-500 group-hover:border-blue-500 group-hover:text-blue-500 transition">
                        <i class="fa-solid fa-plus text-base sm:text-lg"></i>
                    </div>
                    <span class="text-[10px] sm:text-[11px] font-semibold text-slate-600 dark:text-slate-400 truncate w-12 sm:w-14 text-center">내 스토리</span>
                </div>
                <div id="storiesContainer" class="flex items-center gap-3 sm:gap-4"></div>
            </div>

            <!-- 피드 포스트 -->
            <div id="postFeedContainer" class="space-y-4 sm:space-y-6"></div>
        </section>

        <!-- Sidebar -->
        <aside class="hidden md:block space-y-6">
            <div id="profileCard" class="bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm"></div>
            <div id="recommendationCard" class="bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm">
                <div class="flex items-center justify-between text-xs font-bold text-slate-900 dark:text-white mb-3">
                    <span>회원님을 위한 맞춤 추천</span>
                    <i class="fa-solid fa-sparkles text-amber-500"></i>
                </div>
                <div id="recommendationList" class="space-y-3 text-xs"></div>
            </div>
            <div class="bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm">
                <div class="flex items-center justify-between text-xs font-bold text-slate-900 dark:text-white mb-3">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-newspaper text-blue-500"></i> 오늘의 주요 뉴스</span>
                    <span class="text-[10px] text-slate-400 font-normal">1시간마다 갱신</span>
                </div>
                <div id="newsList" class="space-y-2.5 text-xs"></div>
            </div>
            <footer class="text-[11px] text-slate-400 leading-relaxed font-sans px-1">
                소개 • 도움말 • 개인정보처리방침 • 약관
                <p class="mt-3 text-slate-500">© 2026 WOONGSTAGRAM WEB APP</p>
            </footer>
        </aside>
    </main>

    <!-- 📱 모바일 하단 전용 내비게이션 바 -->
    <nav class="fixed bottom-0 left-0 right-0 h-12 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 z-40 flex items-center justify-around text-lg text-slate-800 dark:text-slate-200 md:hidden">
        <a href="/" class="p-2 text-slate-900 dark:text-white"><i class="fa-solid fa-house"></i></a>
        <button onclick="openReelsModal()" class="p-2 hover:text-pink-500"><i class="fa-solid fa-clapperboard"></i></button>
        <button onclick="openCreatePostModal()" class="p-2 hover:text-blue-500"><i class="fa-square-plus fa-regular text-xl"></i></button>
        <button onclick="toggleDarkMode()" class="p-2 hover:text-amber-500"><i id="themeIconMobile" class="fa-regular fa-moon"></i></button>
        <a href="/profile" id="bottomProfileLink" class="p-2 hover:text-blue-500"><i class="fa-regular fa-user"></i></a>
    </nav>

    <!-- 🔍 게시글 상세 보기 모달 -->
    <div id="postDetailModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl max-h-[85vh] rounded-2xl overflow-hidden shadow-2xl relative flex flex-col sm:flex-row border border-slate-200 dark:border-slate-800">
            <button onclick="closePostDetailModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 z-10 p-1 bg-white/80 dark:bg-slate-800/80 rounded-full"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div id="modalImageArea" class="bg-black sm:w-1/2 flex items-center justify-center min-h-[220px]"></div>
            <div class="p-4 sm:w-1/2 flex flex-col justify-between text-xs overflow-y-auto bg-white dark:bg-slate-900">
                <div>
                    <div class="flex items-center gap-2 pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
                        <span id="modalUserAvatar" class="w-7 h-7 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0"></span>
                        <a id="modalUsername" href="#" class="font-bold text-slate-900 dark:text-white hover:underline"></a>
                    </div>
                    <p id="modalContent" class="text-slate-700 dark:text-slate-300 leading-relaxed mb-4 pb-3 border-b border-slate-100 dark:border-slate-800 break-words"></p>
                    <div id="modalCommentsList" class="space-y-2 text-[11px] mb-4"></div>
                </div>
                <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                    <input type="text" id="modalCommentInput" placeholder="댓글 달기..." class="flex-1 text-xs outline-none bg-transparent text-slate-800 dark:text-slate-200 placeholder-slate-400">
                    <button id="modalCommentSubmitBtn" class="text-blue-500 font-semibold text-xs ml-2 hover:text-blue-700">게시</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 💬 1:1 DM 모달 -->
    <div id="dmModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-2 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg h-[550px] rounded-2xl overflow-hidden shadow-2xl relative flex flex-col border border-slate-200 dark:border-slate-800">
            <div class="h-12 border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <button id="dmBackBtn" onclick="showDmList()" class="hidden text-slate-600 dark:text-slate-300 mr-1"><i class="fa-solid fa-arrow-left"></i></button>
                    <span id="dmTitle" class="font-bold text-sm">메시지</span>
                </div>
                <button onclick="closeDmModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="dmListView" class="flex-1 overflow-y-auto p-3 space-y-1">
                <div id="dmConvContainer" class="space-y-1"></div>
            </div>
            <div id="dmChatView" class="hidden flex-1 flex flex-col justify-between bg-slate-50 dark:bg-slate-950 overflow-hidden">
                <div id="dmMessagesContainer" class="flex-1 overflow-y-auto space-y-2 p-3 text-xs"></div>
                <div class="p-2.5 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
                    <input type="text" id="dmMessageInput" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendDmMessage()" class="flex-1 px-3 py-2 text-xs bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none text-slate-900 dark:text-white">
                    <button onclick="sendDmMessage()" class="px-3.5 py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold text-xs rounded-lg transition">전송</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🎬 릴스 모달 -->
    <div id="reelsModal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center">
        <button onclick="closeReelsModal()" class="absolute top-5 right-5 text-white text-2xl hover:text-slate-400 z-50"><i class="fa-solid fa-xmark"></i></button>
        <div id="reelsContainer" class="w-full max-w-sm h-[85vh] bg-slate-900 rounded-2xl overflow-hidden relative shadow-2xl border border-slate-800 flex items-center justify-center"></div>
    </div>

    <!-- 📝 게시물 작성 모달 -->
    <div id="createPostModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeCreatePostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">새 게시물 만들기</h3>
            <div class="space-y-3 text-xs">
                <div class="border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 bg-slate-50 dark:bg-slate-800 flex flex-col gap-1">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-semibold text-slate-600 dark:text-slate-300">사진 / 동영상 선택</span>
                        <span class="text-[10px] text-blue-500 font-bold">최대 5장</span>
                    </div>
                    <input type="file" id="postFileInput" accept="image/*,video/*" multiple onchange="handleMultipleFileSelect(this, 'post')" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100">
                </div>
                <div id="postCroppedPreviewArea" class="hidden py-2">
                    <div id="postPreviewList" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar"></div>
                </div>
                <textarea id="postContentInput" rows="4" placeholder="문구 입력... #해시태그 @멘션 지원" class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none focus:border-slate-400 bg-transparent text-slate-900 dark:text-white resize-none"></textarea>
                <button id="submitPostBtn" onclick="submitNewPost()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition disabled:bg-blue-300">공유하기</button>
            </div>
        </div>
    </div>

    <!-- 📸 스토리 작성 모달 -->
    <div id="createStoryModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeCreateStoryModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-sm font-bold text-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">내 스토리 올리기 (24시간)</h3>
            <div class="space-y-3 text-xs">
                <div class="border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 bg-slate-50 dark:bg-slate-800 flex flex-col gap-1">
                    <span class="text-[11px] font-semibold text-slate-600 dark:text-slate-300">스토리 사진 선택</span>
                    <input type="file" id="storyFileInput" accept="image/*" onchange="handleMultipleFileSelect(this, 'story')" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:bg-pink-50 file:text-pink-600">
                </div>
                <div id="storyPreviewArea" class="hidden text-center py-1">
                    <img id="storyPreviewImg" class="max-h-36 mx-auto rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm">
                </div>
                <textarea id="storyDescInput" rows="3" placeholder="스토리에 남길 문구..." class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-transparent text-slate-900 dark:text-white resize-none"></textarea>
                <button id="submitStoryBtn" onclick="submitNewStory()" class="w-full py-2.5 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-lg transition disabled:bg-pink-300">스토리 올리기</button>
            </div>
        </div>
    </div>

    <!-- ✂️ 고기능 이미지 크로퍼 & 편집 모달 -->
    <div id="cropperModal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl relative flex flex-col max-h-[92vh] border border-slate-200 dark:border-slate-800">
            <div class="p-3 border-b border-slate-100 dark:border-slate-800 font-bold text-xs text-slate-900 dark:text-white flex justify-between items-center">
                <span id="cropperModalTitle">사진 편집 (1 / 1)</span>
                <button onclick="closeCropperModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-2 bg-black flex-1 overflow-hidden flex items-center justify-center min-h-[300px] max-h-[420px]">
                <img id="cropperTargetImage" class="max-w-full max-h-full block">
            </div>
            <div class="p-2.5 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 text-xs">
                <div class="flex items-center gap-1.5" id="cropperRatioGroup">
                    <button onclick="setCropRatio(1)" class="px-2.5 py-1 bg-white dark:bg-slate-700 border rounded font-semibold text-[11px]">1:1</button>
                    <button onclick="setCropRatio(4/5)" class="px-2.5 py-1 bg-white dark:bg-slate-700 border rounded font-semibold text-[11px]">4:5</button>
                    <button onclick="setCropRatio(9/16)" class="px-2.5 py-1 bg-white dark:bg-slate-700 border rounded font-semibold text-[11px]">9:16</button>
                    <button onclick="setCropRatio(NaN)" class="px-2.5 py-1 bg-white dark:bg-slate-700 border rounded font-semibold text-[11px]">자유</button>
                </div>
                <div class="flex items-center gap-1 text-slate-700 dark:text-slate-200">
                    <button onclick="cropperZoom(0.1)" class="p-1.5 bg-white dark:bg-slate-700 border rounded"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    <button onclick="cropperZoom(-0.1)" class="p-1.5 bg-white dark:bg-slate-700 border rounded"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                    <button onclick="cropperRotate(90)" class="p-1.5 bg-white dark:bg-slate-700 border rounded"><i class="fa-solid fa-rotate-right"></i></button>
                    <button onclick="cropperFlip()" class="p-1.5 bg-white dark:bg-slate-700 border rounded"><i class="fa-solid fa-arrows-left-right"></i></button>
                </div>
            </div>
            <div class="p-3 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 flex gap-2">
                <button onclick="closeCropperModal()" class="w-1/3 py-2 bg-slate-100 dark:bg-slate-800 font-semibold text-xs rounded-lg">취소</button>
                <button onclick="applyCroppedImage()" class="flex-1 py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold text-xs rounded-lg transition" id="cropperApplyBtn">적용</button>
            </div>
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div id="authModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-200 dark:border-slate-800">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div class="text-center mb-6">
                <h2 class="text-3xl font-black font-serif italic mb-1 tracking-tight text-slate-900 dark:text-white">Woongstagram</h2>
                <p class="text-xs text-slate-500" id="authModalSubtitle">Woongstagram에 로그인하세요.</p>
            </div>
            <div id="loginFormArea" class="space-y-2.5 text-xs">
                <input type="text" id="loginUsername" placeholder="사용자 이름 (아이디)" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <input type="password" id="loginPassword" placeholder="비밀번호" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <button onclick="handleLoginSubmit()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition shadow-sm mt-2">로그인</button>
            </div>
            <div id="signupFormArea" class="space-y-2.5 text-xs hidden">
                <input type="text" id="signupUsername" placeholder="사용자 이름 (아이디)" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <input type="email" id="signupEmail" placeholder="이메일 주소" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <input type="password" id="signupPassword" placeholder="비밀번호" class="w-full px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg outline-none bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                <button onclick="handleSignupSubmit()" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg transition shadow-sm mt-2">가입하기</button>
            </div>
            <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800 text-center text-xs text-slate-500">
                <span id="authToggleText">계정이 없으신가요?</span>
                <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-blue-500 font-bold ml-1 hover:underline">가입하기</button>
            </div>
        </div>
    </div>

    <!-- 스토리 뷰어 모달 -->
    <div id="storyModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center">
        <button onclick="closeStoryModal()" class="absolute top-5 right-5 text-white text-2xl hover:text-slate-400 z-50"><i class="fa-solid fa-xmark"></i></button>
        <div class="w-full max-w-sm h-[580px] bg-slate-900 rounded-2xl overflow-hidden relative flex flex-col justify-between shadow-2xl border border-slate-800">
            <div class="p-4 z-10 bg-gradient-to-b from-black/80 to-transparent">
                <div class="w-full bg-white/30 h-1 rounded-full mb-3 overflow-hidden">
                    <div id="storyProgress" class="bg-white h-full w-0"></div>
                </div>
                <div class="flex items-center justify-between text-white text-xs">
                    <div class="flex items-center gap-2">
                        <span id="storyUser" class="font-bold">username</span>
                        <span id="storyTimeAgo" class="text-white/60 text-[10px]">방금 전</span>
                    </div>
                </div>
            </div>
            <div id="storyBg" class="absolute inset-0 flex flex-col items-center justify-end text-white p-6 pb-16 text-center bg-cover bg-center">
                <p id="storyDesc" class="text-lg font-bold text-white drop-shadow"></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let currentUser = null;
        let isAdminUser = false;
        let currentAuthView = 'login';
        let activeDmPartner = null;
        let searchTimer = null;
        let storyTimer = null;

        let cropperInstance = null;
        let currentCropMode = null;
        let pendingFiles = [];
        let currentFileIndex = 0;
        let postCroppedBlobs = [];
        let storyCroppedBlob = null;
        let isFlippedX = false;

        function getDefaultAvatar(sizeClass = "text-base") {
            return `<div class="w-full h-full bg-slate-200 dark:bg-slate-700 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-user ${sizeClass}"></i></div>`;
        }

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                const tMob = document.getElementById('themeIconMobile');
                if (tMob) tMob.className = 'fa-regular fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                const tMob = document.getElementById('themeIconMobile');
                if (tMob) tMob.className = 'fa-regular fa-moon';
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                const tMob = document.getElementById('themeIconMobile');
                if (tMob) tMob.className = 'fa-regular fa-moon';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                const tMob = document.getElementById('themeIconMobile');
                if (tMob) tMob.className = 'fa-regular fa-sun';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            checkLoginStatus();
            loadStories();
            loadPosts();
            loadHotNews();
            setInterval(loadNotifications, 10000);

            const urlParams = new URLSearchParams(window.location.search);
            const dmTarget = urlParams.get('dm');
            if (dmTarget) {
                setTimeout(() => openDmModal(dmTarget), 300);
            }
            const postIdTarget = urlParams.get('post');
            if (postIdTarget) {
                setTimeout(() => openPostDetailModal(postIdTarget), 300);
            }
        });

        function timeAgo(dateString) {
            if (!dateString) return '방금 전';
            const formattedDate = dateString.replace(' ', 'T');
            const past = new Date(formattedDate);
            const now = new Date();
            if (isNaN(past.getTime())) return '방금 전';

            const diffInSeconds = Math.floor((now - past) / 1000);
            if (diffInSeconds < 60) return '방금 전';
            const diffInMinutes = Math.floor(diffInSeconds / 60);
            if (diffInMinutes < 60) return `${diffInMinutes}분 전`;
            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours}시간 전`;
            const diffInDays = Math.floor(diffInHours / 24);
            if (diffInDays < 7) return `${diffInDays}일 전`;
            return `${past.getFullYear()}년 ${past.getMonth() + 1}월 ${past.getDate()}일`;
        }

        function formatFormattedText(text) {
            if (!text) return '';
            let formatted = escapeHtml(text);
            formatted = formatted.replace(/#([a-zA-Z0-9ㄱ-ㅎ가-힣_]+)/g, '<span onclick="event.stopPropagation(); filterByTag(\'$1\')" class="text-blue-500 font-semibold cursor-pointer hover:underline">#$1</span>');
            formatted = formatted.replace(/@([a-zA-Z0-9_]+)/g, '<a href="/profile/$1" onclick="event.stopPropagation();" class="text-blue-500 font-semibold hover:underline">@$1</a>');
            return formatted;
        }

        function filterByTag(tag) {
            fetch(`/api/posts/tag/${encodeURIComponent(tag)}`)
                .then(res => res.json())
                .then(data => {
                    const feed = document.getElementById('postFeedContainer');
                    feed.innerHTML = `<div class="p-3 bg-blue-50 dark:bg-slate-800 rounded-xl text-xs font-bold text-blue-600 flex justify-between items-center">
                        <span>#${escapeHtml(tag)} 검색 결과 (${data.posts.length}개)</span>
                        <button onclick="loadPosts()" class="text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">전체 보기</button>
                    </div>`;
                    renderPostsToContainer(data.posts, feed);
                });
        }

        function checkLoginStatus() {
            fetch('/api/me')
                .then(res => res.json())
                .then(data => {
                    const card = document.getElementById('profileCard');
                    const adminBtn = document.getElementById('headerAdminBtn');

                    if (data.logged_in) {
                        currentUser = data.username;
                        isAdminUser = data.is_admin;
                        loadNotifications();
                        loadFollowRequests();

                        if (isAdminUser && adminBtn) {
                            adminBtn.classList.remove('hidden');
                        }

                        const avatar = data.profile_img ? `<img src="${data.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-sm");
                        card.innerHTML = `
                            <div class="flex items-center justify-between text-xs">
                                <div class="flex items-center gap-3">
                                    <a href="/profile/${currentUser}" class="w-10 h-10 rounded-full border border-slate-200 dark:border-slate-700 flex items-center justify-center overflow-hidden shrink-0">${avatar}</a>
                                    <a href="/profile/${currentUser}" class="font-bold hover:underline">@${escapeHtml(currentUser)}</a>
                                </div>
                                <a href="/profile/${currentUser}" class="text-blue-500 font-semibold text-[11px] hover:underline">프로필</a>
                            </div>
                        `;
                    } else {
                        currentUser = null;
                        if (adminBtn) adminBtn.classList.add('hidden');
                        card.innerHTML = `
                            <p class="text-xs text-slate-500 mb-3">로그인하여 친구들과 사진을 공유해 보세요.</p>
                            <button onclick="openAuthModal()" class="w-full py-2 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded-lg">로그인 / 회원가입</button>
                        `;
                    }
                    loadRecommendations();
                });
        }

        function loadPosts() {
            fetch('/api/posts')
                .then(res => res.json())
                .then(data => {
                    const feed = document.getElementById('postFeedContainer');
                    feed.innerHTML = '';
                    renderPostsToContainer(data.posts, feed);
                });
        }

        function renderPostsToContainer(posts, container) {
            if (!posts || posts.length === 0) {
                container.innerHTML += `<div class="text-center py-12 text-xs text-slate-400">게시글이 없습니다.</div>`;
                return;
            }

            posts.forEach(post => {
                const article = document.createElement('article');
                article.className = "border border-slate-200 dark:border-slate-800 rounded-xl bg-white dark:bg-slate-900 overflow-hidden shadow-sm";
                
                const images = post.image_urls && post.image_urls.length > 0 ? post.image_urls : (post.image_url ? [post.image_url] : []);
                let mediaHtml = '';

                if (post.is_video && images.length > 0) {
                    mediaHtml = `<video src="${escapeHtml(images[0])}" controls playsinline class="w-full max-h-[450px] bg-black"></video>`;
                } else if (images.length === 1) {
                    mediaHtml = `<img src="${escapeHtml(images[0])}" class="w-full max-h-[450px] object-cover border-y border-slate-100 dark:border-slate-800">`;
                } else if (images.length > 1) {
                    // 다중 사진 (최대 5장) 슬라이더 구현
                    const items = images.map(img => `<div class="min-w-full w-full shrink-0"><img src="${escapeHtml(img)}" class="w-full max-h-[450px] object-cover"></div>`).join('');
                    mediaHtml = `
                        <div class="relative border-y border-slate-100 dark:border-slate-800 group">
                            <div class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar" onscroll="updateSlideIndicator(this, ${post.id})">
                                ${items}
                            </div>
                            <div class="absolute top-3 right-3 bg-black/60 text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10">
                                <span id="slideIndex-${post.id}">1</span> / ${images.length}
                            </div>
                        </div>
                    `;
                }

                const avatar = post.profile_img ? `<img src="${post.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");

                article.innerHTML = `
                    <div class="p-3 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
                        <div class="flex items-center gap-2.5">
                            <a href="/profile/${post.username}" class="w-8 h-8 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700 shrink-0">${avatar}</a>
                            <a href="/profile/${post.username}" class="text-xs font-semibold hover:underline">@${escapeHtml(post.username)}</a>
                        </div>
                        <span class="text-[10px] text-slate-400">${timeAgo(post.created_at)}</span>
                    </div>
                    ${mediaHtml}
                    <div class="p-3 text-xs">
                        <div class="flex items-center justify-between text-xl mb-2.5 text-slate-800 dark:text-slate-200">
                            <div class="flex items-center gap-4">
                                <i onclick="toggleLike(event, ${post.id})" id="likeIcon-${post.id}" class="${post.is_liked ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart'} cursor-pointer"></i>
                                <i onclick="focusComment(${post.id})" class="fa-regular fa-comment cursor-pointer"></i>
                            </div>
                            <i onclick="toggleBookmark(event, ${post.id}, this)" class="${post.is_bookmarked ? 'fa-solid fa-bookmark text-slate-900 dark:text-white' : 'fa-regular fa-bookmark'} cursor-pointer hover:text-blue-500" title="저장하기"></i>
                        </div>
                        <p class="font-semibold mb-1" id="likeCount-${post.id}">좋아요 ${post.likes}개</p>
                        <p class="leading-relaxed mb-3">
                            <a href="/profile/${post.username}" class="font-semibold mr-1.5 hover:underline">@${escapeHtml(post.username)}</a>
                            ${formatFormattedText(post.content)}
                        </p>
                        <div id="commentList-${post.id}" class="space-y-1 text-[11px] mb-3"></div>
                        <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                            <input type="text" id="commentInput-${post.id}" placeholder="댓글 달기..." onkeypress="if(event.key==='Enter') addComment(${post.id})" class="flex-1 text-xs outline-none bg-transparent placeholder-slate-400">
                            <button onclick="addComment(${post.id})" class="text-blue-500 font-semibold text-xs ml-2 hover:text-blue-700">게시</button>
                        </div>
                    </div>
                `;
                container.appendChild(article);
                loadComments(post.id);
            });
        }

        function updateSlideIndicator(el, postId) {
            const index = Math.round(el.scrollLeft / el.clientWidth) + 1;
            const indicator = document.getElementById(`slideIndex-${postId}`);
            if (indicator) indicator.innerText = index;
        }

        function toggleLike(e, postId) {
            if (e) e.stopPropagation();
            if (!currentUser) { openAuthModal(); return; }
            fetch(`/api/posts/${postId}/like`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        const icon = document.getElementById(`likeIcon-${postId}`);
                        const count = document.getElementById(`likeCount-${postId}`);
                        if (icon) icon.className = data.is_liked ? 'fa-solid fa-heart text-red-500 cursor-pointer' : 'fa-regular fa-heart cursor-pointer';
                        if (count) count.innerText = `좋아요 ${data.likes}개`;
                    }
                });
        }

        function toggleBookmark(e, postId, icon) {
            if (e) e.stopPropagation();
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            fetch(`/api/posts/${postId}/bookmark`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        icon.className = data.is_bookmarked ? 'fa-solid fa-bookmark text-slate-900 dark:text-white cursor-pointer' : 'fa-regular fa-bookmark cursor-pointer';
                    }
                });
        }

        function handleSearchInput(v) {
            clearTimeout(searchTimer);
            const drop = document.getElementById('searchResultsDropdown');
            const uBox = document.getElementById('searchUserResults');
            const pBox = document.getElementById('searchPostResults');

            if (!v.trim()) {
                drop.classList.add('hidden');
                return;
            }

            searchTimer = setTimeout(() => {
                fetch(`/api/search?q=${encodeURIComponent(v.trim())}`)
                    .then(res => res.json())
                    .then(data => {
                        uBox.innerHTML = ''; 
                        pBox.innerHTML = '';

                        let hasResults = false;

                        if (data.users && data.users.length > 0) {
                            hasResults = true;
                            const uTitle = document.createElement('div');
                            uTitle.className = "text-[10px] font-bold text-slate-400 px-2 py-1";
                            uTitle.innerText = "사용자";
                            uBox.appendChild(uTitle);

                            data.users.forEach(u => {
                                const a = document.createElement('a');
                                a.href = `/profile/${u.username}`;
                                a.className = "flex items-center gap-2 p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded font-bold";
                                const uAvatar = u.profile_img ? `<img src="${u.profile_img}" class="w-6 h-6 rounded-full object-cover">` : getDefaultAvatar("text-[9px]");
                                a.innerHTML = `<div class="w-6 h-6 rounded-full overflow-hidden shrink-0">${uAvatar}</div><span>@${escapeHtml(u.username)}</span>`;
                                uBox.appendChild(a);
                            });
                        }

                        if (data.posts && data.posts.length > 0) {
                            hasResults = true;
                            const pTitle = document.createElement('div');
                            pTitle.className = "text-[10px] font-bold text-slate-400 px-2 py-1 mt-1";
                            pTitle.innerText = "게시물 / 태그";
                            pBox.appendChild(pTitle);

                            data.posts.forEach(p => {
                                const div = document.createElement('div');
                                div.className = "p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded cursor-pointer truncate";
                                div.onclick = () => {
                                    drop.classList.add('hidden');
                                    openPostDetailModal(p.id);
                                };
                                div.innerHTML = `<p class="font-semibold truncate">${escapeHtml(p.content)}</p><span class="text-[9px] text-slate-400">@${escapeHtml(p.username)}</span>`;
                                pBox.appendChild(div);
                            });
                        }

                        if (hasResults) {
                            drop.classList.remove('hidden');
                        } else {
                            uBox.innerHTML = '<div class="p-3 text-center text-slate-400 text-xs">검색 결과가 없습니다.</div>';
                            drop.classList.remove('hidden');
                        }
                    });
            }, 200);
        }

        function setCropRatio(ratio) {
            if (cropperInstance) cropperInstance.setAspectRatio(ratio);
        }
        function cropperZoom(delta) {
            if (cropperInstance) cropperInstance.zoom(delta);
        }
        function cropperRotate(deg) {
            if (cropperInstance) cropperInstance.rotate(deg);
        }
        function cropperFlip() {
            if (!cropperInstance) return;
            isFlippedX = !isFlippedX;
            cropperInstance.scaleX(isFlippedX ? -1 : 1);
        }

        function handleMultipleFileSelect(input, mode) {
            if (!input.files || input.files.length === 0) return;
            currentCropMode = mode;
            
            let filesArr = Array.from(input.files);
            
            // 📸 최대 5장 제한
            if (mode === 'post' && filesArr.length > 5) {
                alert('사진 및 동영상은 최대 5장까지만 선택할 수 있습니다. (첫 5장만 적용됩니다)');
                filesArr = filesArr.slice(0, 5);
            }

            pendingFiles = filesArr;
            currentFileIndex = 0;
            isFlippedX = false;
            
            if (mode === 'post') postCroppedBlobs = [];
            else storyCroppedBlob = null;
            
            processNextFile();
        }

        function processNextFile() {
            if (currentFileIndex >= pendingFiles.length) {
                closeCropperModal();
                if (currentCropMode === 'story' && storyCroppedBlob) {
                    document.getElementById('storyPreviewImg').src = URL.createObjectURL(storyCroppedBlob);
                    document.getElementById('storyPreviewArea').classList.remove('hidden');
                } else if (currentCropMode === 'post') {
                    updatePostPreviewArea();
                }
                return;
            }

            const file = pendingFiles[currentFileIndex];
            if (file.type.startsWith('video/')) {
                postCroppedBlobs.push(file);
                currentFileIndex++;
                processNextFile();
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('cropperTargetImage');
                img.src = e.target.result;
                
                document.getElementById('cropperModalTitle').innerText = `사진 편집 (${currentFileIndex + 1} / ${pendingFiles.length})`;
                document.getElementById('cropperApplyBtn').innerText = (currentFileIndex === pendingFiles.length - 1) ? '적용' : '다음 사진';
                document.getElementById('cropperModal').classList.remove('hidden');

                if (cropperInstance) {
                    cropperInstance.destroy();
                    cropperInstance = null;
                }

                const initialRatio = currentCropMode === 'story' ? 9/16 : 1;
                cropperInstance = new Cropper(img, {
                    aspectRatio: initialRatio,
                    viewMode: 1,
                    autoCropArea: 0.95,
                    responsive: true
                });
            };
            reader.readAsDataURL(file);
        }

        function closeCropperModal() { 
            document.getElementById('cropperModal').classList.add('hidden'); 
            if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
        }

        function applyCroppedImage() {
            if (!cropperInstance) return;
            cropperInstance.getCroppedCanvas({ 
                maxWidth: 1080,
                maxHeight: 1920,
                fillColor: '#fff'
            }).toBlob(blob => {
                if (currentCropMode === 'post') postCroppedBlobs.push(blob);
                else storyCroppedBlob = blob;
                
                currentFileIndex++;
                processNextFile();
            }, 'image/jpeg', 0.88);
        }

        function updatePostPreviewArea() {
            const list = document.getElementById('postPreviewList');
            list.innerHTML = '';
            postCroppedBlobs.forEach((blob, idx) => {
                const url = URL.createObjectURL(blob);
                const isVid = blob.type && blob.type.startsWith('video/');
                const div = document.createElement('div');
                div.className = "relative shrink-0";
                div.innerHTML = `
                    <${isVid ? 'video' : 'img'} src="${url}" class="w-16 h-16 object-cover rounded-lg border border-slate-200 dark:border-slate-700"></${isVid ? 'video' : 'img'}>
                    <span class="absolute bottom-1 right-1 bg-black/70 text-white text-[9px] px-1 rounded font-bold">${idx + 1}</span>
                `;
                list.appendChild(div);
            });
            document.getElementById('postCroppedPreviewArea').classList.remove('hidden');
        }

        function openCreateStoryModal() { 
            if (!currentUser) { openAuthModal(); return; } 
            document.getElementById('createStoryModal').classList.remove('hidden'); 
        }
        function closeCreateStoryModal() { 
            document.getElementById('createStoryModal').classList.add('hidden'); 
            storyCroppedBlob = null;
            document.getElementById('storyPreviewArea').classList.add('hidden');
            document.getElementById('storyFileInput').value = '';
            document.getElementById('storyDescInput').value = '';
        }

        async function submitNewStory() {
            const desc = document.getElementById('storyDescInput').value.trim();
            const btn = document.getElementById('submitStoryBtn');
            let imageUrl = '';

            if (!desc && !storyCroppedBlob) {
                alert('스토리 사진이나 문구를 입력해 주세요.');
                return;
            }

            btn.disabled = true;
            btn.innerText = '올리는 중...';

            try {
                if (storyCroppedBlob) {
                    const formData = new FormData();
                    formData.append('file', storyCroppedBlob, 'story.jpg');
                    const uploadRes = await fetch('/api/upload', { method: 'POST', body: formData });
                    const d = await uploadRes.json();
                    if (d.status === 'success') {
                        imageUrl = d.image_url;
                    } else {
                        throw new Error(d.message || '업로드 실패');
                    }
                }

                const res = await fetch('/api/stories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ desc: desc, image_url: imageUrl })
                });
                const d = await res.json();
                if (d.status === 'success') {
                    closeCreateStoryModal();
                    loadStories();
                } else {
                    alert(d.message || '스토리 등록 실패');
                }
            } catch (err) {
                alert('스토리 등록 중 오류: ' + (err.message || err));
            } finally {
                btn.disabled = false;
                btn.innerText = '스토리 올리기';
            }
        }

        function loadStories() {
            fetch('/api/stories').then(res => res.json()).then(data => {
                const c = document.getElementById('storiesContainer');
                c.innerHTML = '';
                if (data.status === 'success') {
                    data.stories.forEach(s => {
                        const avatar = s.profile_img ? `<img src="${s.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");
                        const item = document.createElement('div');
                        item.className = "flex flex-col items-center gap-1 min-w-[56px] sm:min-w-[64px] cursor-pointer group shrink-0";
                        item.onclick = () => showStoryModal(item, s.id, s.username, s.desc, s.image_url, s.profile_img, s.created_at);
                        
                        const ringClass = s.is_viewed ? 'story-viewed' : 'story-ring';
                        item.innerHTML = `
                            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full p-[2px] ${ringClass} transition group-hover:scale-105">
                                <div class="w-full h-full rounded-full bg-white dark:bg-slate-900 flex items-center justify-center border-2 border-white dark:border-slate-900 overflow-hidden text-[10px]">${avatar}</div>
                            </div>
                            <span class="text-[10px] sm:text-[11px] text-slate-600 dark:text-slate-400 truncate w-12 sm:w-14 text-center">@${escapeHtml(s.username)}</span>
                        `;
                        c.appendChild(item);
                    });
                }
            });
        }

        function showStoryModal(el, storyId, username, desc, imageUrl, profileImg, createdAt) {
            if (currentUser) {
                fetch(`/api/stories/${storyId}/view`, { method: 'POST' });
            }

            const ring = el.querySelector('.story-ring');
            if (ring) { 
                ring.classList.remove('story-ring'); 
                ring.classList.add('story-viewed'); 
            }

            document.getElementById('storyUser').innerText = `@${username}`;
            document.getElementById('storyDesc').innerText = desc || '';
            
            const timeEl = document.getElementById('storyTimeAgo');
            if (timeEl) {
                timeEl.innerText = timeAgo(createdAt);
            }

            const bg = document.getElementById('storyBg');
            if (imageUrl) {
                bg.style.backgroundImage = `url('${imageUrl}')`;
                bg.className = "absolute inset-0 flex flex-col items-center justify-end text-white p-6 pb-16 text-center bg-cover bg-center";
            } else {
                bg.style.backgroundImage = 'none';
                bg.className = "absolute inset-0 flex flex-col items-center justify-center text-white p-8 text-center bg-gradient-to-br from-pink-500 to-rose-600";
            }

            const modal = document.getElementById('storyModal');
            const progress = document.getElementById('storyProgress');
            modal.classList.remove('hidden');
            progress.classList.remove('animate-progress');
            void progress.offsetWidth;
            progress.classList.add('animate-progress');

            clearTimeout(storyTimer);
            storyTimer = setTimeout(() => closeStoryModal(), 5000);
        }

        function closeStoryModal() { 
            document.getElementById('storyModal').classList.add('hidden'); 
            clearTimeout(storyTimer);
        }

        function openCreatePostModal() { if(!currentUser){openAuthModal();return;} document.getElementById('createPostModal').classList.remove('hidden'); }
        function closeCreatePostModal() { 
            document.getElementById('createPostModal').classList.add('hidden'); 
            postCroppedBlobs = [];
            document.getElementById('postCroppedPreviewArea').classList.add('hidden');
            document.getElementById('postFileInput').value = '';
            document.getElementById('postContentInput').value = '';
        }

        async function submitNewPost() {
            const content = document.getElementById('postContentInput').value.trim();
            const btn = document.getElementById('submitPostBtn');
            let imageUrls = [];
            let isVideo = false;

            if (!content && postCroppedBlobs.length === 0) {
                alert('사진이나 글 내용을 입력해 주세요.');
                return;
            }

            btn.disabled = true;
            btn.innerText = '공유 중...';

            try {
                if (postCroppedBlobs.length > 0) {
                    const formData = new FormData();
                    postCroppedBlobs.forEach((b, idx) => {
                        const filename = (b.type && b.type.startsWith('video/')) ? `post_${idx}.mp4` : `post_${idx}.jpg`;
                        formData.append('files', b, filename);
                    });
                    const res = await fetch('/api/upload', { method: 'POST', body: formData });
                    const d = await res.json();
                    if (d.status === 'success') {
                        imageUrls = d.image_urls || [d.image_url];
                        isVideo = d.is_video;
                    } else {
                        throw new Error(d.message || '업로드 실패');
                    }
                }

                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, image_urls: imageUrls, is_video: isVideo })
                });
                const d2 = await res.json();

                if (d2.status === 'success') {
                    closeCreatePostModal();
                    loadPosts();
                } else {
                    alert(d2.message || '게시글 등록 실패');
                }
            } catch (err) {
                alert('게시글 등록 중 오류: ' + (err.message || err));
            } finally {
                btn.disabled = false;
                btn.innerText = '공유하기';
            }
        }

        function openPostDetailModal(postId) {
            fetch(`/api/posts/${postId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        const post = data.post;
                        const avatarBox = document.getElementById('modalUserAvatar');
                        if (post.profile_img) {
                            avatarBox.innerHTML = `<img src="${post.profile_img}" class="w-full h-full object-cover">`;
                        } else {
                            avatarBox.innerHTML = getDefaultAvatar("text-xs");
                        }

                        document.getElementById('modalUsername').innerText = `@${post.username}`;
                        document.getElementById('modalUsername').href = `/profile/${post.username}`;
                        document.getElementById('modalContent').innerHTML = formatFormattedText(post.content);

                        const imgArea = document.getElementById('modalImageArea');
                        const images = post.image_urls && post.image_urls.length > 0 ? post.image_urls : (post.image_url ? [post.image_url] : []);
                        
                        if (post.is_video && images.length > 0) {
                            imgArea.innerHTML = `<video src="${escapeHtml(images[0])}" controls autoplay playsinline class="w-full max-h-[350px]"></video>`;
                        } else if (images.length > 0) {
                            imgArea.innerHTML = `
                                <div class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar w-full max-h-[350px]">
                                    ${images.map(img => `<div class="min-w-full w-full shrink-0 flex items-center justify-center bg-black"><img src="${escapeHtml(img)}" class="max-h-[350px] object-contain"></div>`).join('')}
                                </div>
                            `;
                        } else {
                            imgArea.innerHTML = `<div class="text-white text-xs p-6 text-center">${escapeHtml(post.content)}</div>`;
                        }

                        const submitBtn = document.getElementById('modalCommentSubmitBtn');
                        submitBtn.onclick = () => submitModalComment(post.id);

                        loadModalComments(post.id);
                        document.getElementById('postDetailModal').classList.remove('hidden');
                    }
                });
        }

        function closePostDetailModal() {
            document.getElementById('postDetailModal').classList.add('hidden');
        }

        function loadModalComments(postId) {
            fetch(`/api/comments/${postId}`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('modalCommentsList');
                    list.innerHTML = '';
                    if (data.status === 'success') {
                        data.comments.forEach(c => {
                            const p = document.createElement('p');
                            p.innerHTML = `<a href="/profile/${c.username}" class="font-bold text-slate-900 dark:text-white hover:underline">@${escapeHtml(c.username)}</a> ${formatFormattedText(c.content)}`;
                            list.appendChild(p);
                        });
                    }
                });
        }

        function submitModalComment(postId) {
            if (!currentUser) { openAuthModal(); return; }
            const input = document.getElementById('modalCommentInput');
            if (!input.value.trim()) return;

            fetch('/api/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id: postId, content: input.value.trim() })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    loadModalComments(postId);
                    input.value = '';
                }
            });
        }

        function openDmModal(partner = null) {
            if (!currentUser) { alert('로그인이 필요합니다.'); openAuthModal(); return; }
            document.getElementById('dmModal').classList.remove('hidden');
            if (partner && partner !== currentUser) loadDmMessages(partner);
            else showDmList();
        }
        function closeDmModal() { document.getElementById('dmModal').classList.add('hidden'); activeDmPartner = null; }
        function showDmList() {
            activeDmPartner = null;
            document.getElementById('dmTitle').innerText = '메시지';
            document.getElementById('dmBackBtn').classList.add('hidden');
            document.getElementById('dmListView').classList.remove('hidden');
            document.getElementById('dmChatView').classList.add('hidden');
            loadDmConversations();
        }

        function loadDmConversations() {
            fetch('/api/dm/conversations').then(res => res.json()).then(data => {
                const container = document.getElementById('dmConvContainer');
                container.innerHTML = '';
                if (!data.conversations || data.conversations.length === 0) {
                    container.innerHTML = '<p class="text-slate-400 text-xs py-10 text-center">대화 내역이 없습니다.<br><span class="text-[11px]">프로필에서 [메시지]를 눌러 대화를 시작해 보세요!</span></p>';
                    return;
                }
                data.conversations.forEach(c => {
                    const avatar = c.profile_img ? `<img src="${c.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");
                    const item = document.createElement('div');
                    item.className = "p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer flex items-center justify-between gap-2.5 transition";
                    item.onclick = () => loadDmMessages(c.partner);
                    item.innerHTML = `
                        <div class="flex items-center gap-3 truncate">
                            <div class="w-9 h-9 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700 shrink-0">${avatar}</div>
                            <div class="truncate">
                                <p class="font-bold text-xs text-slate-900 dark:text-white">@${escapeHtml(c.partner)}</p>
                                <p class="text-[11px] text-slate-400 truncate">${escapeHtml(c.last_message)}</p>
                            </div>
                        </div>
                        ${c.unread_count > 0 ? `<span class="bg-blue-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold">${c.unread_count}</span>` : ''}
                    `;
                    container.appendChild(item);
                });
            });
        }

        function loadDmMessages(partner) {
            activeDmPartner = partner;
            document.getElementById('dmTitle').innerText = `@${partner}`;
            document.getElementById('dmBackBtn').classList.remove('hidden');
            document.getElementById('dmListView').classList.add('hidden');
            document.getElementById('dmChatView').classList.remove('hidden');

            fetch(`/api/dm/${encodeURIComponent(partner)}`).then(res => res.json()).then(data => {
                const container = document.getElementById('dmMessagesContainer');
                container.innerHTML = '';
                if (!data.messages || data.messages.length === 0) {
                    container.innerHTML = `<p class="text-center text-slate-400 text-[11px] py-6">@${escapeHtml(partner)} 님과 대화를 시작해 보세요!</p>`;
                } else {
                    data.messages.forEach(m => {
                        const isMe = m.sender === currentUser;
                        const msgDiv = document.createElement('div');
                        msgDiv.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                        msgDiv.innerHTML = `
                            <div class="max-w-[75%] px-3 py-1.5 rounded-2xl ${isMe ? 'bg-blue-500 text-white rounded-br-none' : 'bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white rounded-bl-none'}">
                                <p class="leading-relaxed">${escapeHtml(m.message)}</p>
                                <span class="text-[8px] opacity-70 block text-right mt-0.5">${m.created_at}</span>
                            </div>
                        `;
                        container.appendChild(msgDiv);
                    });
                }
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendDmMessage() {
            if (!activeDmPartner) return;
            const input = document.getElementById('dmMessageInput');
            const msg = input.value.trim();
            if (!msg) return;

            fetch(`/api/dm/${encodeURIComponent(activeDmPartner)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            }).then(() => {
                input.value = '';
                loadDmMessages(activeDmPartner);
            });
        }

        function openReelsModal() {
            fetch('/api/reels').then(res => res.json()).then(data => {
                const container = document.getElementById('reelsContainer');
                container.innerHTML = '';
                if (data.status === 'success' && data.reels.length > 0) {
                    const reel = data.reels[0];
                    container.innerHTML = `
                        <video src="${reel.video_url}" autoplay loop playsinline class="w-full h-full object-cover"></video>
                        <div class="absolute bottom-4 left-4 right-4 text-white text-xs drop-shadow z-10">
                            <p class="font-bold mb-1">@${escapeHtml(reel.username)}</p>
                            <p>${formatFormattedText(reel.content)}</p>
                        </div>
                    `;
                    document.getElementById('reelsModal').classList.remove('hidden');
                } else {
                    alert('등록된 릴스 동영상이 없습니다.');
                }
            });
        }
        function closeReelsModal() { document.getElementById('reelsModal').classList.add('hidden'); }

        function loadComments(postId) {
            fetch(`/api/comments/${postId}`).then(res => res.json()).then(data => {
                const list = document.getElementById(`commentList-${postId}`);
                list.innerHTML = '';
                data.comments.forEach(c => {
                    const p = document.createElement('p');
                    p.innerHTML = `<a href="/profile/${c.username}" class="font-semibold mr-1">@${escapeHtml(c.username)}</a> ${formatFormattedText(c.content)}`;
                    list.appendChild(p);
                });
            });
        }

        function addComment(postId) {
            if (!currentUser) { openAuthModal(); return; }
            const input = document.getElementById(`commentInput-${postId}`);
            if (!input.value.trim()) return;
            fetch('/api/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ post_id: postId, content: input.value.trim() })
            }).then(() => { input.value = ''; loadComments(postId); });
        }

        function focusComment(id) { document.getElementById(`commentInput-${id}`).focus(); }

        function loadNotifications() {
            if (!currentUser) return;
            fetch('/api/notifications').then(res => res.json()).then(data => {
                if (data.status === 'success') {
                    const badge = document.getElementById('notifBadge');
                    if (data.unread_count > 0) {
                        badge.innerText = data.unread_count;
                        badge.classList.remove('hidden');
                    } else badge.classList.add('hidden');

                    const list = document.getElementById('notifList');
                    list.innerHTML = '';
                    data.notifications.forEach(n => {
                        let text = '';
                        if (n.type === 'like') text = '님이 게시글을 좋아합니다. ❤️';
                        else if (n.type === 'comment') text = '님이 댓글을 남겼습니다. 💬';
                        else if (n.type === 'mention') text = '님이 회원님을 멘션했습니다. 📣';
                        else if (n.type === 'dm') text = '님이 새 메시지를 보냈습니다. ✉️';
                        else if (n.type === 'follow') text = '님이 팔로우하기 시작했습니다. 👤';
                        else if (n.type === 'follow_accept') text = '님이 팔로우 요청을 수락했습니다. 🎉';
                        
                        const div = document.createElement('div');
                        div.className = "p-1.5 rounded text-[11px]";
                        div.innerHTML = `<strong>@${escapeHtml(n.actor)}</strong> ${text}`;
                        list.appendChild(div);
                    });
                }
            });
        }

        function toggleNotificationDropdown(e) {
            e.stopPropagation();
            const d = document.getElementById('notifDropdown');
            d.classList.toggle('hidden');
            if (!d.classList.contains('hidden')) {
                fetch('/api/notifications/read', { method: 'POST' });
                document.getElementById('notifBadge').classList.add('hidden');
            }
        }

        function loadFollowRequests() {
            fetch('/api/follow-requests').then(res => res.json()).then(data => {
                const sec = document.getElementById('followRequestsSection');
                const list = document.getElementById('followRequestsList');
                if (data.status === 'success' && data.requests.length > 0) {
                    sec.classList.remove('hidden');
                    list.innerHTML = '';
                    data.requests.forEach(r => {
                        const item = document.createElement('div');
                        item.className = "flex items-center justify-between text-[11px] py-1";
                        item.innerHTML = `
                            <span><strong>@${escapeHtml(r.requester)}</strong> 님의 요청</span>
                            <div class="flex gap-1.5">
                                <button onclick="handleReq('${r.requester}', 'accept')" class="px-2 py-0.5 bg-blue-500 text-white rounded font-bold">승인</button>
                                <button onclick="handleReq('${r.requester}', 'reject')" class="px-2 py-0.5 bg-slate-200 dark:bg-slate-700 rounded">삭제</button>
                            </div>
                        `;
                        list.appendChild(item);
                    });
                } else sec.classList.add('hidden');
            });
        }

        function handleReq(requester, action) {
            fetch(`/api/follow-requests/${encodeURIComponent(requester)}/${action}`, { method: 'POST' })
                .then(() => loadFollowRequests());
        }

        function handleOutsideClicks(e) {
            const notif = document.getElementById('notifDropdown');
            if (notif && !notif.contains(e.target)) notif.classList.add('hidden');
            const search = document.getElementById('searchResultsDropdown');
            if (search && !search.contains(e.target)) search.classList.add('hidden');
        }

        function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        function toggleAuthMode() {
            currentAuthView = currentAuthView === 'login' ? 'signup' : 'login';
            document.getElementById('loginFormArea').classList.toggle('hidden', currentAuthView !== 'login');
            document.getElementById('signupFormArea').classList.toggle('hidden', currentAuthView !== 'signup');
            document.getElementById('authToggleBtn').innerText = currentAuthView === 'login' ? '가입하기' : '로그인';
        }

        function handleLoginSubmit() {
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: u, password: p }) })
                .then(res => res.json()).then(d => { if(d.status==='success') location.reload(); else alert(d.message); });
        }

        function handleSignupSubmit() {
            const u = document.getElementById('signupUsername').value.trim();
            const e = document.getElementById('signupEmail').value.trim();
            const p = document.getElementById('signupPassword').value.trim();
            fetch('/api/signup', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: u, email: e, password: p }) })
                .then(res => res.json()).then(d => { if(d.status==='success') location.reload(); else alert(d.message); });
        }

        function loadHotNews() {
            fetch('/api/news').then(res => res.json()).then(data => {
                const list = document.getElementById('newsList');
                list.innerHTML = '';
                data.articles.forEach(a => {
                    const d = document.createElement('div');
                    d.innerHTML = `<a href="${a.link}" target="_blank" class="font-semibold text-slate-800 dark:text-slate-300 hover:underline line-clamp-1">${escapeHtml(a.title)}</a>`;
                    list.appendChild(d);
                });
            });
        }

        function loadRecommendations() {
            fetch('/api/recommendations').then(res => res.json()).then(data => {
                const l = document.getElementById('recommendationList');
                l.innerHTML = '';
                data.recommendations.forEach(r => {
                    const avatar = r.profile_img ? `<img src="${r.profile_img}" class="w-full h-full object-cover">` : getDefaultAvatar("text-xs");
                    const d = document.createElement('div');
                    d.className = "flex justify-between items-center";
                    d.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <a href="/profile/${r.username}" class="w-8 h-8 rounded-full border border-slate-200 dark:border-slate-700 flex items-center justify-center overflow-hidden shrink-0">${avatar}</a>
                            <div class="flex flex-col">
                                <a href="/profile/${r.username}" class="font-semibold hover:underline">@${escapeHtml(r.username)}</a>
                                <span class="text-[10px] text-slate-400">${escapeHtml(r.reason)}</span>
                            </div>
                        </div>
                    `;
                    l.appendChild(d);
                });
            });
        }

        function escapeHtml(t) { return t ? t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
    </script>
</body>
</html>
